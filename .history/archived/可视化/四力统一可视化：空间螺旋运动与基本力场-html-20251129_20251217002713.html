<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>四力统一可视化：空间螺旋运动与基本力场</title>
    <script src=" https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js "></script>
    <script src=" https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js "></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background: linear-gradient(to bottom, #0a0a2a, #1a1a3a);
            color: white;
        }
        #container {
            position: relative;
            width: 100%;
            height: 100vh;
        }
        #canvas-container {
            width: 100%;
            height: 100%;
        }
        #info-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 10px;
            max-width: 300px;
            backdrop-filter: blur(5px);
        }
        #controls {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 10px;
            backdrop-filter: blur(5px);
        }
        h1 {
            margin-top: 0;
            color: #4fc3f7;
            font-size: 1.5em;
        }
        .force-info {
            margin: 10px 0;
            padding: 8px;
            border-left: 3px solid;
            background: rgba(255, 255, 255, 0.1);
        }
        .gravitational { border-color: #ff5252; }
        .electromagnetic { border-color: #448aff; }
        .nuclear-strong { border-color: #69f0ae; }
        .nuclear-weak { border-color: #ffab40; }
        button {
            background: #4fc3f7;
            border: none;
            padding: 8px 15px;
            margin: 5px;
            border-radius: 5px;
            cursor: pointer;
            color: white;
            font-weight: bold;
        }
        button:hover {
            background: #29b6f6;
        }
        .slider-container {
            margin: 10px 0;
        }
        label {
            display: block;
            margin-bottom: 5px;
        }
        input[type="range"] {
            width: 100%;
        }
    </style>
</head>
<body>
    <div id="container">
        <div id="canvas-container"></div>
        
        <div id="info-panel">
            <h1>四力统一可视化</h1>
            <p>基于张祥前统一场论：物体周围空间以圆柱状螺旋式运动产生四种基本力</p>
            
            <div class="force-info gravitational">
                <strong>引力场 (红色)</strong><br>
                方向：径向指向物体中心<br>
                来源：空间螺旋运动的径向加速度分量
            </div>
            
            <div class="force-info electromagnetic">
                <strong>电磁场 (蓝色)</strong><br>
                方向：垂直于径向的旋转平面<br>
                来源：空间螺旋运动的旋转分量
            </div>
            
            <div class="force-info nuclear-strong">
                <strong>强核力 (绿色)</strong><br>
                方向：沿螺旋轴线方向<br>
                来源：空间螺旋运动的轴向压缩
            </div>
            
            <div class="force-info nuclear-weak">
                <strong>弱核力 (橙色)</strong><br>
                方向：螺旋运动的扭曲变化<br>
                来源：空间螺旋运动的手性不对称
            </div>
        </div>
        
        <div id="controls">
            <h3>控制面板</h3>
            <button id="toggle-animation">暂停/继续动画</button>
            <button id="reset-view">重置视角</button>
            
            <div class="slider-container">
                <label for="spiral-density">螺旋密度</label>
                <input type="range" id="spiral-density" min="1" max="10" value="5">
            </div>
            
            <div class="slider-container">
                <label for="force-strength">力场强度</label>
                <input type="range" id="force-strength" min="1" max="10" value="7">
            </div>
        </div>
    </div>

    <script>
        // 初始化Three.js场景
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setClearColor(0x0a0a2a);
        document.getElementById('canvas-container').appendChild(renderer.domElement);
        
        // 添加轨道控制
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        camera.position.set(0, 8, 12);
        controls.update();
        
        // 添加环境光
        const ambientLight = new THREE.AmbientLight(0x404040);
        scene.add(ambientLight);
        
        // 添加定向光
        const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
        directionalLight.position.set(10, 10, 5);
        scene.add(directionalLight);
        
        // 中心物体（质点）
        const centerGeometry = new THREE.SphereGeometry(1, 32, 32);
        const centerMaterial = new THREE.MeshPhongMaterial({ 
            color: 0xffffff, 
            emissive: 0x222222,
            shininess: 100 
        });
        const centerObject = new THREE.Mesh(centerGeometry, centerMaterial);
        scene.add(centerObject);
        
        // 创建螺旋线和力场可视化
        const spiralLines = [];
        const forceFields = {
            gravitational: [], // 引力场 - 红色
            electromagnetic: [], // 电磁场 - 蓝色
            nuclearStrong: [], // 强核力 - 绿色
            nuclearWeak: []    // 弱核力 - 橙色
        };
        
        // 创建螺旋运动可视化
        function createSpiralVisualization() {
            const spiralCount = 8; // 螺旋线数量
            const pointsPerSpiral = 100; // 每条螺旋线的点数
            const maxRadius = 5; // 最大半径
            
            for (let i = 0; i < spiralCount; i++) {
                const points = [];
                const angleOffset = (i / spiralCount) * Math.PI * 2;
                
                for (let j = 0; j <= pointsPerSpiral; j++) {
                    const t = j / pointsPerSpiral;
                    const radius = t * maxRadius;
                    const angle = angleOffset + t * Math.PI * 8; // 螺旋角度
                    const height = t * 10 - 5; // 螺旋高度
                    
                    const x = radius * Math.cos(angle);
                    const y = radius * Math.sin(angle);
                    const z = height;
                    
                    points.push(new THREE.Vector3(x, y, z));
                }
                
                const geometry = new THREE.BufferGeometry().setFromPoints(points);
                const material = new THREE.LineBasicMaterial({ 
                    color: 0x4fc3f7,
                    transparent: true,
                    opacity: 0.7
                });
                const spiral = new THREE.Line(geometry, material);
                scene.add(spiral);
                spiralLines.push(spiral);
            }
        }
        
        // 创建力场可视化
        function createForceFieldVisualization() {
            const fieldPointCount = 200;
            
            // 引力场可视化（红色箭头，指向中心）
            for (let i = 0; i < fieldPointCount; i++) {
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos(Math.random() * 2 - 1);
                const radius = 2 + Math.random() * 3;
                
                const x = radius * Math.sin(phi) * Math.cos(theta);
                const y = radius * Math.sin(phi) * Math.sin(theta);
                const z = radius * Math.cos(phi);
                
                // 创建指向中心的箭头
                const direction = new THREE.Vector3(-x, -y, -z).normalize();
                const arrowHelper = new THREE.ArrowHelper(
                    direction, 
                    new THREE.Vector3(x, y, z), 
                    0.5, 
                    0xff5252, 
                    0.3, 
                    0.15
                );
                scene.add(arrowHelper);
                forceFields.gravitational.push(arrowHelper);
            }
            
            // 电磁场可视化（蓝色箭头，旋转方向）
            for (let i = 0; i < fieldPointCount; i++) {
                const theta = Math.random() * Math.PI * 2;
                const radius = 2 + Math.random() * 3;
                const height = Math.random() * 8 - 4;
                
                const x = radius * Math.cos(theta);
                const y = radius * Math.sin(theta);
                const z = height;
                
                // 创建切线方向的箭头（电磁场方向）
                const tangent = new THREE.Vector3(-y, x, 0).normalize();
                const arrowHelper = new THREE.ArrowHelper(
                    tangent, 
                    new THREE.Vector3(x, y, z), 
                    0.5, 
                    0x448aff, 
                    0.3, 
                    0.15
                );
                scene.add(arrowHelper);
                forceFields.electromagnetic.push(arrowHelper);
            }
            
            // 强核力可视化（绿色箭头，沿轴线方向）
            for (let i = 0; i < fieldPointCount / 4; i++) {
                const radius = Math.random() * 0.5;
                const theta = Math.random() * Math.PI * 2;
                const z = Math.random() * 6 - 3;
                
                const x = radius * Math.cos(theta);
                const y = radius * Math.sin(theta);
                
                // 创建沿Z轴方向的箭头
                const direction = new THREE.Vector3(0, 0, z > 0 ? 1 : -1);
                const arrowHelper = new THREE.ArrowHelper(
                    direction, 
                    new THREE.Vector3(x, y, z), 
                    0.3, 
                    0x69f0ae, 
                    0.2, 
                    0.1
                );
                scene.add(arrowHelper);
                forceFields.nuclearStrong.push(arrowHelper);
            }
            
            // 弱核力可视化（橙色箭头，表现不对称性）
            for (let i = 0; i < fieldPointCount / 4; i++) {
                const theta = Math.random() * Math.PI * 2;
                const radius = 1 + Math.random() * 2;
                const z = Math.random() * 4 - 2;
                
                const x = radius * Math.cos(theta);
                const y = radius * Math.sin(theta);
                
                // 创建表现弱力不对称性的箭头
                const direction = new THREE.Vector3(
                    Math.sin(theta) * 0.5,
                    -Math.cos(theta) * 0.5,
                    Math.random() - 0.5
                ).normalize();
                
                const arrowHelper = new THREE.ArrowHelper(
                    direction, 
                    new THREE.Vector3(x, y, z), 
                    0.3, 
                    0xffab40, 
                    0.2, 
                    0.1
                );
                scene.add(arrowHelper);
                forceFields.nuclearWeak.push(arrowHelper);
            }
        }
        
        // 初始化可视化
        createSpiralVisualization();
        createForceFieldVisualization();
        
        // 动画状态
        let animationPlaying = true;
        let time = 0;
        
        // 动画循环
        function animate() {
            requestAnimationFrame(animate);
            
            if (animationPlaying) {
                time += 0.02;
                
                // 更新螺旋线（表现空间运动）
                spiralLines.forEach((spiral, index) => {
                    spiral.rotation.y = time * 0.2;
                    spiral.position.y = Math.sin(time + index) * 0.5;
                });
                
                // 更新中心物体
                centerObject.rotation.y = time * 0.5;
                
                // 更新力场可视化
                updateForceFields();
            }
            
            controls.update();
            renderer.render(scene, camera);
        }
        
        // 更新力场可视化
        function updateForceFields() {
            // 引力场保持指向中心
            
            // 电磁场随时间变化方向
            forceFields.electromagnetic.forEach((arrow, index) => {
                const pos = arrow.position;
                const tangent = new THREE.Vector3(-pos.y, pos.x, 0).normalize();
                arrow.setDirection(tangent);
                
                // 添加脉动效果
                const scale = 0.5 + 0.2 * Math.sin(time * 5 + index * 0.1);
                arrow.setLength(scale, 0.3, 0.15);
            });
            
            // 强核力脉动效果
            forceFields.nuclearStrong.forEach((arrow, index) => {
                const scale = 0.3 + 0.1 * Math.sin(time * 3 + index * 0.2);
                arrow.setLength(scale, 0.2, 0.1);
            });
            
            // 弱核力随机变化效果
            forceFields.nuclearWeak.forEach((arrow, index) => {
                if (Math.random() < 0.05) {
                    const newDirection = new THREE.Vector3(
                        Math.random() - 0.5,
                        Math.random() - 0.5,
                        Math.random() - 0.5
                    ).normalize();
                    arrow.setDirection(newDirection);
                }
            });
        }
        
        // 控制面板功能
        document.getElementById('toggle-animation').addEventListener('click', function() {
            animationPlaying = !animationPlaying;
            this.textContent = animationPlaying ? '暂停动画' : '继续动画';
        });
        
        document.getElementById('reset-view').addEventListener('click', function() {
            controls.reset();
        });
        
        document.getElementById('spiral-density').addEventListener('input', function(e) {
            const density = parseInt(e.target.value);
            // 调整螺旋线透明度来表现密度变化
            spiralLines.forEach(spiral => {
                spiral.material.opacity = 0.3 + (density / 10) * 0.5;
            });
        });
        
        document.getElementById('force-strength').addEventListener('input', function(e) {
            const strength = parseInt(e.target.value) / 10;
            // 调整力场箭头大小来表现强度变化
            Object.values(forceFields).forEach(fieldArray => {
                fieldArray.forEach(arrow => {
                    const currentLength = arrow.line.scale.z; // 获取当前长度
                    arrow.setLength(currentLength * strength, currentLength * 0.6, currentLength * 0.3);
                });
            });
        });
        
        // 响应窗口大小变化
        window.addEventListener('resize', function() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
        
        // 启动动画
        animate();
    </script>
</body>
</html>
