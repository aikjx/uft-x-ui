<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>统一场论·圆柱螺旋发散</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 0.2;
            }
            50% {
                opacity: 0.8;
            }
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow: hidden;
            background: linear-gradient(to bottom, black, #0f172a, #1e293b);
            color: white;
        }

        #container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        /* 背景星星 */
        .stars {
            position: absolute;
            inset: 0;
            z-index: 0;
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: pulse var(--duration) infinite var(--delay);
        }

        /* 标题区域 */
        .title-area {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            padding: 24px;
            background: linear-gradient(to bottom, rgba(0, 0, 0, 0.95), rgba(0, 0, 0, 0.7), transparent);
            z-index: 10;
        }

        .title {
            font-size: 3rem;
            font-weight: bold;
            background: linear-gradient(to right, orange, yellow, cyan);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
        }

        .subtitle {
            color: rgba(129, 140, 248, 0.9);
            font-size: 1.125rem;
            margin-bottom: 4px;
        }

        .description {
            color: rgba(96, 165, 250, 0.7);
            font-size: 0.875rem;
        }

        /* 控制面板 */
        .control-panel {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 24px;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.95), rgba(0, 0, 0, 0.8), transparent);
            max-height: 45vh;
            overflow-y: auto;
            z-index: 10;
        }

        .control-container {
            max-width: 1280px;
            margin: 0 auto;
        }

        .sliders-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 12px;
            margin-bottom: 16px;
        }

        .slider-group {
            padding: 12px;
            background: linear-gradient(135deg, rgba(234, 88, 12, 0.3), rgba(220, 38, 38, 0.3));
            border: 2px solid rgba(251, 146, 60, 0.7);
            border-radius: 8px;
            backdrop-filter: blur(10px);
        }

        .slider-label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.75rem;
            font-weight: bold;
            color: rgba(251, 146, 60, 0.8);
        }

        input[type="range"] {
            width: 100%;
            height: 8px;
            margin-bottom: 4px;
            background: rgba(251, 146, 60, 0.2);
            border-radius: 4px;
            appearance: none;
            cursor: pointer;
        }

        input[type="range"]::-webkit-slider-thumb {
            appearance: none;
            width: 16px;
            height: 16px;
            background: linear-gradient(135deg, orange, yellow);
            border-radius: 50%;
            box-shadow: 0 2px 8px rgba(251, 146, 60, 0.8);
        }

        .slider-values {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
        }

        .min-value, .max-value {
            color: rgba(251, 146, 60, 0.5);
        }

        .current-value {
            color: rgba(251, 146, 60, 0.9);
            font-weight: bold;
        }

        /* 控制按钮 */
        .control-buttons {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px;
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid rgba(6, 182, 212, 0.5);
            border-radius: 12px;
            backdrop-filter: blur(10px);
        }

        .play-button {
            padding: 12px 40px;
            font-size: 1.125rem;
            font-weight: bold;
            color: white;
            background: linear-gradient(to right, orange, yellow, cyan);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .play-button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(6, 182, 212, 0.5);
        }

        /* 状态信息 */
        .status-info {
            display: flex;
            gap: 24px;
        }

        .status-item {
            text-align: center;
        }

        .status-value {
            font-size: 1.25rem;
            font-weight: bold;
        }

        .status-label {
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.6);
        }

        /* 技术信息 */
        .tech-info {
            text-align: right;
        }

        .tech-title {
            color: rgba(6, 182, 212, 0.9);
            font-family: monospace;
            font-size: 0.875rem;
            margin-bottom: 4px;
        }

        .tech-description {
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.75rem;
        }

        /* 方程样式 */
        .equation {
            font-size: 1.5rem;
            margin: 8px 0;
            color: rgba(103, 232, 249, 1);
            text-shadow: 0 0 10px rgba(103, 232, 249, 0.5);
        }

        /* 滚动条样式 */
        .control-panel::-webkit-scrollbar {
            width: 6px;
        }

        .control-panel::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.5);
            border-radius: 3px;
        }

        .control-panel::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, orange, yellow, cyan);
            border-radius: 3px;
        }
    </style>
</head>
<body>
    <div id="container">
        <!-- 背景星星 -->
        <div class="stars" id="stars"></div>

        <!-- 标题区域 -->
        <div class="title-area">
            <h1 class="title">统一场论·三维螺旋时空</h1>
            <p class="subtitle">Unified Field - 3D Spacetime Spiral</p>
            <p class="description">三维螺旋时空方程可视化：</p>
            <p class="equation" id="spiral-equation"></p>
        </div>

        <!-- Three.js 渲染容器 -->
        <div id="renderer-container"></div>

        <!-- 控制面板 -->
        <div class="control-panel">
            <div class="control-container">
                <div class="sliders-grid">
                    <!-- 螺旋数量 -->
                    <div class="slider-group">
                        <label class="slider-label">🌐 发散方向数</label>
                        <input type="range" id="spiralCount" min="8" max="64" step="4" value="12">
                        <div class="slider-values">
                            <span class="min-value">8</span>
                            <span class="current-value" id="spiralCountValue">12</span>
                            <span class="max-value">64</span>
                        </div>
                    </div>

                    <!-- 半径 -->
                    <div class="slider-group">
                        <label class="slider-label">⭕ 圆柱半径</label>
                        <input type="range" id="radius" min="1" max="8" step="0.5" value="3">
                        <div class="slider-values">
                            <span class="min-value">1</span>
                            <span class="current-value" id="radiusValue">3</span>
                            <span class="max-value">8</span>
                        </div>
                    </div>

                    <!-- 长度 -->
                    <div class="slider-group">
                        <label class="slider-label">📏 发散长度</label>
                        <input type="range" id="length" min="15" max="50" step="5" value="30">
                        <div class="slider-values">
                            <span class="min-value">15</span>
                            <span class="current-value" id="lengthValue">30</span>
                            <span class="max-value">50</span>
                        </div>
                    </div>

                    <!-- 旋转圈数 -->
                    <div class="slider-group">
                        <label class="slider-label">🌀 旋转圈数</label>
                        <input type="range" id="rotations" min="2" max="20" step="1" value="8">
                        <div class="slider-values">
                            <span class="min-value">2</span>
                            <span class="current-value" id="rotationsValue">8</span>
                            <span class="max-value">20</span>
                        </div>
                    </div>

                    <!-- 角速度 -->
                    <div class="slider-group">
                        <label class="slider-label">⚡ 角速度 ω</label>
                        <input type="range" id="angularSpeed" min="0.2" max="3" step="0.2" value="1.0">
                        <div class="slider-values">
                            <span class="min-value">0.2</span>
                            <span class="current-value" id="angularSpeedValue">1.0</span>
                            <span class="max-value">3.0</span>
                        </div>
                    </div>

                    <!-- 螺旋紧密度 -->
                    <div class="slider-group">
                        <label class="slider-label">🔧 螺旋紧密度</label>
                        <input type="range" id="helixTightness" min="0.5" max="2" step="0.1" value="1.0">
                        <div class="slider-values">
                            <span class="min-value">0.5</span>
                            <span class="current-value" id="helixTightnessValue">1.0</span>
                            <span class="max-value">2.0</span>
                        </div>
                    </div>

                    <!-- 粒子密度 -->
                    <div class="slider-group">
                        <label class="slider-label">✨ 粒子密度</label>
                        <input type="range" id="particleDensity" min="50" max="250" step="25" value="150">
                        <div class="slider-values">
                            <span class="min-value">50</span>
                            <span class="current-value" id="particleDensityValue">150</span>
                            <span class="max-value">250</span>
                        </div>
                    </div>

                    <!-- 场强度 -->
                    <div class="slider-group">
                        <label class="slider-label">🔥 场强度</label>
                        <input type="range" id="fieldIntensity" min="1" max="10" step="1" value="5">
                        <div class="slider-values">
                            <span class="min-value">1</span>
                            <span class="current-value" id="fieldIntensityValue">5</span>
                            <span class="max-value">10</span>
                        </div>
                    </div>
                </div>

                <div class="control-buttons">
                    <button class="play-button" id="playButton">⏸ 暂停</button>

                    <div class="status-info">
                        <div class="status-item">
                            <div class="status-value" id="statusSpiralCount">12</div>
                            <div class="status-label">螺旋方向</div>
                        </div>
                        <div class="status-item">
                            <div class="status-value" id="statusRadius">r = 3</div>
                            <div class="status-label">恒定半径</div>
                        </div>
                        <div class="status-item">
                            <div class="status-value" id="statusRotations">8圈</div>
                            <div class="status-label">螺旋旋转</div>
                        </div>
                    </div>

                    <div class="tech-info">
                        <div class="tech-title">Three.js + WebGL Shaders</div>
                        <div class="tech-description">从原点(0,0,0)球面发散 | 圆柱螺旋轨迹</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 引入 Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <!-- 引入 MathJax -->
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <script>
        // 全局变量
        let scene, camera, renderer;
        let config = {
            spiralCount: 12,
            radius: 3,
            length: 30,
            rotations: 8,
            angularSpeed: 1.0,
            particleDensity: 150,
            fieldIntensity: 5,
            helixTightness: 1.0
        };
        let isPlaying = true;
        let spiralData = [];
        let animationId;

        // 初始化背景星星
        function initStars() {
            const starsContainer = document.getElementById('stars');
            for (let i = 0; i < 200; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                const size = Math.random() * 2 + 0.5;
                star.style.width = size + 'px';
                star.style.height = size + 'px';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.opacity = Math.random() * 0.8 + 0.2;
                const duration = Math.random() * 4 + 2;
                const delay = Math.random() * 2;
                star.style.setProperty('--duration', duration + 's');
                star.style.setProperty('--delay', delay + 's');
                starsContainer.appendChild(star);
            }
        }

        // 初始化Three.js场景
        function initThreeJS() {
            // 创建场景
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x000208);
            scene.fog = new THREE.FogExp2(0x000208, 0.008);

            // 创建相机
            camera = new THREE.PerspectiveCamera(
                70,
                window.innerWidth / window.innerHeight,
                0.1,
                1000
            );
            camera.position.set(45, 30, 45);
            camera.lookAt(0, 0, 0);

            // 创建渲染器
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.getElementById('renderer-container').appendChild(renderer.domElement);

            // 添加光源
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.3);
            scene.add(ambientLight);

            const pointLight1 = new THREE.PointLight(0xffaa00, 3, 100);
            pointLight1.position.set(0, 0, 0);
            scene.add(pointLight1);

            const pointLight2 = new THREE.PointLight(0x00ffff, 1.5, 100);
            pointLight2.position.set(0, 20, 0);
            scene.add(pointLight2);

            const pointLight3 = new THREE.PointLight(0xff00ff, 1.5, 100);
            pointLight3.position.set(0, -20, 0);
            scene.add(pointLight3);

            // 创建中心核心
            const coreGeometry = new THREE.SphereGeometry(1.5, 32, 32);
            const coreMaterial = new THREE.MeshPhongMaterial({
                color: 0xffff00,
                emissive: 0xff6600,
                emissiveIntensity: 3,
                transparent: true,
                opacity: 0.95,
                shininess: 100
            });
            const core = new THREE.Mesh(coreGeometry, coreMaterial);
            scene.add(core);
            
            // 添加核心辉光效果
            const coreGlowGeometry = new THREE.SphereGeometry(2.5, 32, 32);
            const coreGlowMaterial = new THREE.ShaderMaterial({
                uniforms: {
                    time: { value: 0 },
                    intensity: { value: 2.0 }
                },
                vertexShader: `
                    varying vec3 vNormal;
                    void main() {
                        vNormal = normalize(normalMatrix * normal);
                        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                    }
                `,
                fragmentShader: `
                    uniform float time;
                    uniform float intensity;
                    varying vec3 vNormal;
                    
                    void main() {
                        float pulse = 0.5 + 0.5 * sin(time * 6.0);
                        float glow = pow(1.0 - abs(dot(vNormal, vec3(0.0, 0.0, 1.0))), 3.0);
                        vec3 color = vec3(1.0, 0.8, 0.2) * glow * intensity * pulse;
                        gl_FragColor = vec4(color, glow * 0.6);
                    }
                `,
                transparent: true,
                blending: THREE.AdditiveBlending,
                side: THREE.BackSide,
                depthWrite: false
            });
            const coreGlow = new THREE.Mesh(coreGlowGeometry, coreGlowMaterial);
            scene.add(coreGlow);
            spiralData.push({ glow: coreGlow, isCoreGlow: true });

            // 创建环绕环
            for (let i = 1; i <= 3; i++) {
                const ringGeometry = new THREE.TorusGeometry(1.5 * i, 0.1, 16, 100);
                const ringMaterial = new THREE.MeshPhongMaterial({
                    color: 0xff8800,
                    emissive: 0xff4400,
                    emissiveIntensity: 2 / i,
                    transparent: true,
                    opacity: 0.3 / i,
                    side: THREE.DoubleSide
                });
                const ring = new THREE.Mesh(ringGeometry, ringMaterial);
                ring.rotation.x = Math.PI / 2;
                ring.userData.rotSpeed = 0.01 * i;
                scene.add(ring);
                spiralData.push({ ring, isRing: true });
            }

            // 创建发光效果
            const glowGeometry = new THREE.SphereGeometry(3, 32, 32);
            const glowMaterial = new THREE.ShaderMaterial({
                uniforms: {
                    time: { value: 0 },
                    intensity: { value: 1.0 }
                },
                vertexShader: `
                    varying vec3 vNormal;
                    void main() {
                        vNormal = normalize(normalMatrix * normal);
                        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                    }
                `,
                fragmentShader: `
                    uniform float time;
                    uniform float intensity;
                    varying vec3 vNormal;
                    
                    void main() {
                        float pulse = 0.7 + 0.3 * sin(time * 3.0);
                        float glow = pow(1.0 - abs(dot(vNormal, vec3(0.0, 0.0, 1.0))), 2.0);
                        vec3 color = vec3(1.0, 0.5, 0.1) * glow * intensity * pulse;
                        gl_FragColor = vec4(color, glow * 0.5);
                    }
                `,
                transparent: true,
                blending: THREE.AdditiveBlending,
                side: THREE.BackSide
            });
            const glow = new THREE.Mesh(glowGeometry, glowMaterial);
            scene.add(glow);

            // 添加坐标轴
            const axesHelper = new THREE.AxesHelper(20);
            scene.add(axesHelper);

            // 添加网格
            const gridXZ = new THREE.GridHelper(80, 40, 0x00ffff, 0x002244);
            gridXZ.material.opacity = 0.1;
            gridXZ.material.transparent = true;
            scene.add(gridXZ);

            // 创建螺旋场
            createCylindricalSpiralField();

            // 开始动画
            animate();

            // 处理窗口大小变化
            window.addEventListener('resize', handleResize);
        }

        // 创建圆柱螺旋场
        function createCylindricalSpiralField() {
            // 清除旧的螺旋数据
            spiralData.forEach(data => {
                if (!data.isRing && data.line) {
                    scene.remove(data.line);
                    scene.remove(data.tube);
                    scene.remove(data.particles);
                    data.line?.geometry.dispose();
                    data.line?.material.dispose();
                    data.tube?.geometry.dispose();
                    data.tube?.material.dispose();
                    data.particles?.geometry.dispose();
                    data.particles?.material.dispose();
                }
            });
            spiralData = spiralData.filter(d => d.isRing);

            // 生成方向向量
            const directions = [];
            const phi_count = Math.ceil(Math.sqrt(config.spiralCount));
            const theta_count = Math.ceil(config.spiralCount / phi_count);
            
            for (let i = 0; i < phi_count; i++) {
                for (let j = 0; j < theta_count; j++) {
                    if (directions.length >= config.spiralCount) break;
                    
                    const phi = Math.acos(1 - 2 * (i + 0.5) / phi_count);
                    const theta = 2 * Math.PI * (j / theta_count);
                    
                    const x = Math.sin(phi) * Math.cos(theta);
                    const y = Math.cos(phi);
                    const z = Math.sin(phi) * Math.sin(theta);
                    
                    directions.push([x, y, z]);
                }
            }

            // 为每个方向创建螺旋
            directions.forEach((dir, spiralIdx) => {
                const [dx, dy, dz] = dir;
                
                const mag = Math.sqrt(dx * dx + dy * dy + dz * dz);
                const ndx = dx / mag;
                const ndy = dy / mag;
                const ndz = dz / mag;

                let perpX, perpY, perpZ;
                if (Math.abs(ndy) < 0.9) {
                    perpX = 0;
                    perpY = 1;
                    perpZ = 0;
                } else {
                    perpX = 1;
                    perpY = 0;
                    perpZ = 0;
                }
                
                const temp1X = ndy * perpZ - ndz * perpY;
                const temp1Y = ndz * perpX - ndx * perpZ;
                const temp1Z = ndx * perpY - ndy * perpX;
                const temp1Mag = Math.sqrt(temp1X * temp1X + temp1Y * temp1Y + temp1Z * temp1Z);
                const perp1X = temp1X / temp1Mag;
                const perp1Y = temp1Y / temp1Mag;
                const perp1Z = temp1Z / temp1Mag;
                
                const perp2X = ndy * perp1Z - ndz * perp1Y;
                const perp2Y = ndz * perp1X - ndx * perp1Z;
                const perp2Z = ndx * perp1Y - ndy * perp1X;

                // 生成螺旋点 - 严格遵循三维螺旋时空方程
                // 三维螺旋时空方程：$$\vec{r}(t) = r\cos\omega t \cdot \vec{i} + r\sin\omega t \cdot \vec{j} + ht \cdot \vec{k}$$
                // 其中：
                // - \(\vec{i}, \vec{j}, \vec{k}\) 是x, y, z方向的单位向量
                // - r 是螺旋半径
                // - \(\omega\) 是角速度
                // - h 是垂直运动速度
                // - t 是时间参数
                const points = [];
                const colors = [];
                const particlePositions = [];
                const particleColors = [];
                const particleSizes = [];

                // 严格按照三维螺旋时空方程的参数
                const actualDensity = Math.floor(config.particleDensity * 1.5);
                const r = config.radius;              // 螺旋半径 r
                const h = config.length * 0.8;         // 垂直速度 h
                const N = config.rotations;           // 总旋转圈数
                const omega = config.angularSpeed;    // 角速度 ω
                
                for (let i = 0; i <= actualDensity; i++) {
                    // 时间参数t，从0到1变化
                    const t = i / actualDensity;
                    
                    // 计算角度：θ(t) = ω * t * 2π * N
                    // 2π * N 确保完成N圈旋转
                    const theta = omega * t * 2 * Math.PI * N;
                    
                    // 严格按照三维螺旋时空方程计算坐标
                    // 分解为三个单位向量方向的分量
                    
                    // 1. 圆周运动在x方向的分量：r·cos(ωt)·i
                    const x_circular = r * Math.cos(theta);
                    
                    // 2. 圆周运动在y方向的分量：r·sin(ωt)·j
                    const y_circular = r * Math.sin(theta);
                    
                    // 3. 直线运动在z方向的分量：ht·k
                    const z_linear = h * t;
                    
                    // 空间螺旋最终坐标：根据发散方向向量进行矢量变换
                    // 将标准螺旋方程转换到当前发散方向
                    const x = x_circular * perp1X + y_circular * perp2X + z_linear * ndx;
                    const y = x_circular * perp1Y + y_circular * perp2Y + z_linear * ndy;
                    const z = x_circular * perp1Z + y_circular * perp2Z + z_linear * ndz;

                    points.push(new THREE.Vector3(x, y, z));

                    // 生成颜色 - 改进的渐变效果
                const baseHue = 0.05;
                const hueVariation = Math.sin(spiralIdx * 0.5) * 0.2;
                const hue = baseHue + hueVariation + t * 0.6;
                const sat = 1.0 - t * 0.1;
                const light = 0.5 + Math.sin(t * Math.PI) * 0.3;
                const color = new THREE.Color().setHSL(hue, sat, light);
                colors.push(color.r, color.g, color.b);

                if (i % 2 === 0) {
                    particlePositions.push(x, y, z);
                    particleColors.push(color.r, color.g, color.b);
                    particleSizes.push(0.25 + Math.random() * 0.35);
                }
                }

                // 创建螺旋线
                const lineGeometry = new THREE.BufferGeometry().setFromPoints(points);
                lineGeometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));

                const lineMaterial = new THREE.LineBasicMaterial({
                    vertexColors: true,
                    transparent: true,
                    opacity: 0.7,
                    blending: THREE.AdditiveBlending
                });

                const line = new THREE.Line(lineGeometry, lineMaterial);

                // 创建管状结构
                const curve = new THREE.CatmullRomCurve3(points);
                const tubeGeometry = new THREE.TubeGeometry(curve, config.particleDensity, 0.12, 8, false);
                const tubeMaterial = new THREE.MeshPhongMaterial({
                    color: 0x00aaff,
                    transparent: true,
                    opacity: 0.25,
                    emissive: 0x0066ff,
                    emissiveIntensity: 0.6,
                    side: THREE.DoubleSide
                });
                const tube = new THREE.Mesh(tubeGeometry, tubeMaterial);

                // 创建粒子系统
                const particleGeometry = new THREE.BufferGeometry();
                particleGeometry.setAttribute('position', new THREE.Float32BufferAttribute(particlePositions, 3));
                particleGeometry.setAttribute('color', new THREE.Float32BufferAttribute(particleColors, 3));
                particleGeometry.setAttribute('size', new THREE.Float32BufferAttribute(particleSizes, 1));
                particleGeometry.setAttribute('originalPosition', new THREE.Float32BufferAttribute(particlePositions, 3));

                const particleMaterial = new THREE.ShaderMaterial({
                    uniforms: {
                        time: { value: 0 },
                        intensity: { value: config.fieldIntensity }
                    },
                    vertexShader: `
                        attribute float size;
                        attribute vec3 color;
                        attribute vec3 originalPosition;
                        varying vec3 vColor;
                        varying float vDist;
                        uniform float time;
                        uniform float intensity;
                        
                        void main() {
                            vColor = color;
                            
                            // 添加粒子轨迹效果
                            float dist = length(originalPosition);
                            vDist = dist;
                            
                            // 粒子脉动效果
                            float basePulse = 1.0 + 0.6 * abs(sin(time * 3.0 + dist * 0.4));
                            float wavePulse = 0.3 * sin(time * 5.0 + dist * 0.8);
                            float pulse = basePulse + wavePulse;
                            
                            // 粒子大小随距离变化
                            float sizeFactor = 1.0 - smoothstep(0.0, 100.0, dist) * 0.7;
                            
                            // 粒子位置添加微小波动
                            vec3 pos = position;
                            float waveOffset = 0.2 * sin(time * 4.0 + dist * 0.5);
                            pos += normalize(originalPosition) * waveOffset;
                            
                            vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
                            gl_PointSize = size * pulse * sizeFactor * (400.0 / -mvPosition.z) * intensity * 0.2;
                            gl_Position = projectionMatrix * mvPosition;
                        }
                    `,
                    fragmentShader: `
                        varying vec3 vColor;
                        varying float vDist;
                        
                        void main() {
                            vec2 center = gl_PointCoord - vec2(0.5);
                            float dist = length(center);
                            if (dist > 0.5) discard;
                            
                            // 双层发光效果
                            float innerGlow = 1.0 - smoothstep(0.0, 0.3, dist);
                            float outerGlow = 1.0 - smoothstep(0.2, 0.5, dist);
                            
                            // 径向渐变
                            float gradient = 0.5 + 0.5 * cos(dist * 6.28);
                            
                            // 粒子辉光效果
                            float alpha = innerGlow * 0.9 + outerGlow * 0.3;
                            
                            // 颜色增强
                            vec3 finalColor = vColor * (1.0 + outerGlow * 0.5);
                            
                            gl_FragColor = vec4(finalColor, alpha);
                            // 添加发光边缘
                            gl_FragColor.rgb += outerGlow * 0.3;
                        }
                    `,
                    transparent: true,
                    blending: THREE.AdditiveBlending,
                    depthWrite: false
                });

                const particles = new THREE.Points(particleGeometry, particleMaterial);

                // 添加到场景
                scene.add(line);
                scene.add(tube);
                scene.add(particles);

                // 保存螺旋数据
                spiralData.push({
                    line,
                    tube,
                    particles,
                    points,
                    direction: dir,
                    colors,
                    spiralIdx
                });
            });
        }

        // 动画循环
        function animate() {
            if (!isPlaying) return;
            
            animationId = requestAnimationFrame(animate);
            const time = performance.now() * 0.001;

            // 更新核心旋转
            const core = scene.children.find(child => child.geometry && child.geometry.type === 'SphereGeometry' && !child.parent);
            if (core) {
                core.rotation.y += 0.02;
                core.rotation.x += 0.01;
                core.material.emissiveIntensity = 2.5 + Math.sin(time * 4) * 1.5;
            }

            // 更新发光效果
            spiralData.forEach((data) => {
                if (data.glow && data.isCoreGlow) {
                    data.glow.material.uniforms.time.value = time;
                    data.glow.material.uniforms.intensity.value = 2.0 + Math.sin(time * 3) * 0.5;
                }
            });
            
            // 更新中心发光球
            const centerGlow = scene.children.find(child => child.material && child.material.type === 'ShaderMaterial' && !spiralData.some(d => d.glow === child));
            if (centerGlow) {
                centerGlow.material.uniforms.time.value = time;
                centerGlow.material.uniforms.intensity.value = config.fieldIntensity / 5;
            }

            // 更新螺旋效果
            spiralData.forEach((data) => {
                if (data.isRing) {
                    data.ring.rotation.z += data.ring.userData.rotSpeed;
                    return;
                }

                // 增加螺旋自身的旋转，形成更明显的"转圈圈"效果
                const rotationSpeed = 0.03;
                data.line.rotation.x += rotationSpeed;
                data.line.rotation.y += rotationSpeed;
                data.tube.rotation.x += rotationSpeed;
                data.tube.rotation.y += rotationSpeed;
                data.particles.rotation.x += rotationSpeed;
                data.particles.rotation.y += rotationSpeed;

                if (data.particles.material.uniforms) {
                    data.particles.material.uniforms.time.value = time;
                    data.particles.material.uniforms.intensity.value = config.fieldIntensity;
                }

                // 增强粒子的动态效果，让粒子沿螺旋方向有轻微移动，增强发散感
                const positions = data.particles.geometry.attributes.position.array;
                const originalPositions = data.particles.geometry.attributes.originalPosition.array;
                
                // 粒子沿螺旋方向缓慢移动，增强持续发散的视觉效果
                for (let i = 0; i < positions.length; i += 3) {
                    // 基于时间和索引创建缓慢的移动效果
                    const particleIndex = i / 3;
                    const baseMove = Math.sin(time * 0.3 + particleIndex * 0.05) * 0.03;
                    const waveMove = Math.sin(time * 1.2 + particleIndex * 0.2) * 0.015;
                    const moveOffset = baseMove + waveMove;
                    
                    // 沿螺旋方向移动粒子
                    const [dx, dy, dz] = data.direction;
                    
                    // 重置粒子位置到原始位置，然后添加移动偏移
                    positions[i] = originalPositions[i] + dx * moveOffset * 5.0;
                    positions[i + 1] = originalPositions[i + 1] + dy * moveOffset * 5.0;
                    positions[i + 2] = originalPositions[i + 2] + dz * moveOffset * 5.0;
                }
                data.particles.geometry.attributes.position.needsUpdate = true;
            });

            // 更新相机位置
            const radius = 60;
            camera.position.x = Math.cos(time * 0.1) * radius;
            camera.position.z = Math.sin(time * 0.1) * radius;
            camera.position.y = 30 + Math.sin(time * 0.06) * 15;
            camera.lookAt(0, 0, 0);

            // 渲染场景
            renderer.render(scene, camera);
        }

        // 处理窗口大小变化
        function handleResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // 更新配置
        function updateConfig(key, value) {
            config[key] = Number(value);
            // 更新UI显示
            document.getElementById(key + 'Value').textContent = value;
            // 更新状态信息
            if (key === 'spiralCount') {
                document.getElementById('statusSpiralCount').textContent = value;
            } else if (key === 'radius') {
                document.getElementById('statusRadius').textContent = 'r = ' + value;
            } else if (key === 'rotations') {
                document.getElementById('statusRotations').textContent = value + '圈';
            }
            // 重新创建螺旋场
            createCylindricalSpiralField();
        }

        // 初始化UI事件
        function initUI() {
            // 播放/暂停按钮
            const playButton = document.getElementById('playButton');
            playButton.addEventListener('click', () => {
                isPlaying = !isPlaying;
                playButton.textContent = isPlaying ? '⏸ 暂停' : '▶ 播放';
                if (isPlaying) {
                    animate();
                }
            });

            // 滑块事件
            const sliders = [
                'spiralCount', 'radius', 'length', 'rotations',
                'angularSpeed', 'particleDensity', 'fieldIntensity', 'helixTightness'
            ];

            sliders.forEach(sliderId => {
                const slider = document.getElementById(sliderId);
                slider.addEventListener('input', (e) => {
                    updateConfig(sliderId, e.target.value);
                });
            });
        }

        // 初始化所有内容
        function init() {
            initStars();
            initThreeJS();
            initUI();
            initMathJax();
        }

        // 初始化MathJax，渲染螺旋方程
        function initMathJax() {
            // 三维螺旋时空方程
            const equation = '$$\vec{r}(t) = r\cos\omega t \cdot \vec{i} + r\sin\omega t \cdot \vec{j} + ht \cdot \vec{k}$$';
            document.getElementById('spiral-equation').innerHTML = equation;
            
            // 确保MathJax渲染公式
            if (window.MathJax) {
                window.MathJax.typesetPromise([document.getElementById('spiral-equation')]);
            }
        }

        // 页面加载完成后初始化
        window.addEventListener('load', init);
        
        // MathJax加载完成后重新渲染
        window.addEventListener('load', function() {
            setTimeout(initMathJax, 500);
        });
    </script>
</body>
