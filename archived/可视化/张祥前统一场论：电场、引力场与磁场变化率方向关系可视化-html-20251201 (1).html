<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>张祥前统一场论：电场、引力场与磁场变化率方向关系可视化</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        #container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(255, 255, 255, 0.8);
            padding: 15px;
            border-radius: 5px;
            max-width: 300px;
            z-index: 100;
        }
        #controls {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background: rgba(255, 255, 255, 0.8);
            padding: 10px;
            border-radius: 5px;
            z-index: 100;
        }
        h1 {
            font-size: 18px;
            margin-top: 0;
        }
        .vector-label {
            font-size: 14px;
            font-weight: bold;
        }
        .A { color: #ff0000; }
        .E { color: #0000ff; }
        .dBdt { color: #00aa00; }
    </style>
</head>
<body>
    <div id="container">
        <div id="info">
            <h1>张祥前统一场论：电场、引力场与磁场变化率方向关系</h1>
            <p>基于核心方程：∂B/∂t = -1/c² (A × E)</p>
            <p><span class="vector-label A">红色箭头</span>: 引力场 A (方向: -x)</p>
            <p><span class="vector-label E">蓝色箭头</span>: 电场 E (方向: +y)</p>
            <p><span class="vector-label dBdt">绿色箭头</span>: 磁场变化率 ∂B/∂t (方向: -z)</p>
            <p>右手螺旋关系：从A(-x)弯向E(+y)，大拇指指向+z，但∂B/∂t为-z</p>
        </div>
        <div id="controls">
            <button id="rotateToggle">暂停旋转</button>
            <button id="resetView">重置视图</button>
        </div>
    </div>

    <script src=" https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js "></script>
    <script src=" https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js "></script>
    
    <script>
        // 初始化场景
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setClearColor(0xf0f0f0);
        document.getElementById('container').appendChild(renderer.domElement);
        
        // 添加轨道控制
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        
        // 设置相机位置
        camera.position.set(5, 5, 5);
        camera.lookAt(0, 0, 0);
        
        // 添加坐标轴
        const axesHelper = new THREE.AxesHelper(5);
        scene.add(axesHelper);
        
        // 添加坐标轴标签
        function addAxisLabel(text, position, color) {
            const canvas = document.createElement('canvas');
            const context = canvas.getContext('2d');
            canvas.width = 128;
            canvas.height = 64;
            context.fillStyle = color;
            context.font = 'bold 24px Arial';
            context.textAlign = 'center';
            context.fillText(text, 64, 32);
            
            const texture = new THREE.CanvasTexture(canvas);
            const material = new THREE.SpriteMaterial({ map: texture });
            const sprite = new THREE.Sprite(material);
            sprite.position.copy(position);
            sprite.scale.set(2, 1, 1);
            scene.add(sprite);
        }
        
        addAxisLabel('+X', new THREE.Vector3(5.5, 0, 0), '#ff0000');
        addAxisLabel('+Y', new THREE.Vector3(0, 5.5, 0), '#00ff00');
        addAxisLabel('+Z', new THREE.Vector3(0, 0, 5.5), '#0000ff');
        
        // 添加正电荷（原点）
        const chargeGeometry = new THREE.SphereGeometry(0.3, 32, 32);
        const chargeMaterial = new THREE.MeshBasicMaterial({ color: 0xff6600 });
        const charge = new THREE.Mesh(chargeGeometry, chargeMaterial);
        scene.add(charge);
        
        // 添加电荷标签
        addAxisLabel('+q', new THREE.Vector3(0.5, 0.5, 0), '#000000');
        
        // 添加考察点P（在y轴上）
        const pointGeometry = new THREE.SphereGeometry(0.2, 32, 32);
        const pointMaterial = new THREE.MeshBasicMaterial({ color: 0x000000 });
        const pointP = new THREE.Mesh(pointGeometry, pointMaterial);
        pointP.position.set(0, 3, 0);
        scene.add(pointP);
        
        // 添加考察点P标签
        addAxisLabel('P(0,y,0)', new THREE.Vector3(0.5, 3.5, 0), '#000000');
        
        // 创建箭头辅助函数
        function createArrow(direction, length, color, label) {
            const arrowHelper = new THREE.ArrowHelper(
                direction.normalize(),
                new THREE.Vector3(0, 3, 0), // 起点在P点
                length,
                color,
                0.5, // 箭头头部长度
                0.3  // 箭头头部宽度
            );
            
            // 添加标签
            const labelPosition = direction.clone().multiplyScalar(length + 0.5).add(new THREE.Vector3(0, 3, 0));
            addAxisLabel(label, labelPosition, color);
            
            return arrowHelper;
        }
        
        // 创建引力场A箭头（-x方向）
        const aDirection = new THREE.Vector3(-1, 0, 0);
        const aArrow = createArrow(aDirection, 2, 0xff0000, 'A');
        scene.add(aArrow);
        
        // 创建电场E箭头（+y方向）
        const eDirection = new THREE.Vector3(0, 1, 0);
        const eArrow = createArrow(eDirection, 2, 0x0000ff, 'E');
        scene.add(eArrow);
        
        // 创建磁场变化率∂B/∂t箭头（-z方向）
        const dBdtDirection = new THREE.Vector3(0, 0, -1);
        const dBdtArrow = createArrow(dBdtDirection, 2, 0x00aa00, '∂B/∂t');
        scene.add(dBdtArrow);
        
        // 添加右手螺旋示意图
        function createRightHandRuleVisualization() {
            // 创建从A到E的弧线
            const arcPoints = [];
            const radius = 1.5;
            for (let i = 0; i <= 10; i++) {
                const angle = -Math.PI/2 + (i/10) * Math.PI/2; // 从-x到+y的90度弧
                arcPoints.push(new THREE.Vector3(
                    -radius * Math.cos(angle),
                    3 + radius * Math.sin(angle),
                    0
                ));
            }
            
            const arcGeometry = new THREE.BufferGeometry().setFromPoints(arcPoints);
            const arcMaterial = new THREE.LineBasicMaterial({ color: 0x000000, linewidth: 2 });
            const arc = new THREE.Line(arcGeometry, arcMaterial);
            scene.add(arc);
            
            // 添加弧线箭头
            const lastPoint = arcPoints[arcPoints.length - 1];
            const secondLastPoint = arcPoints[arcPoints.length - 2];
            const arrowDirection = new THREE.Vector3().subVectors(lastPoint, secondLastPoint).normalize();
            const arrowHelper = new THREE.ArrowHelper(
                arrowDirection,
                lastPoint,
                0.5,
                0x000000,
                0.2,
                0.1
            );
            scene.add(arrowHelper);
            
            // 添加大拇指方向（+z）
            const thumbDirection = new THREE.Vector3(0, 0, 1);
            const thumbArrow = new THREE.ArrowHelper(
                thumbDirection.normalize(),
                new THREE.Vector3(0, 3, 0),
                2,
                0x888888,
                0.5,
                0.3
            );
            scene.add(thumbArrow);
            
            // 添加大拇指标签
            addAxisLabel('大拇指方向(+z)', new THREE.Vector3(0.5, 3, 2.5), '#888888');
            
            // 添加说明文本
            const canvas = document.createElement('canvas');
            const context = canvas.getContext('2d');
            canvas.width = 256;
            canvas.height = 64;
            context.fillStyle = '#000000';
            context.font = 'bold 16px Arial';
            context.textAlign = 'center';
            context.fillText('右手定则: 从A(-x)弯向E(+y)', 128, 20);
            context.fillText('大拇指指向+z, 但∂B/∂t为-z', 128, 40);
            
            const texture = new THREE.CanvasTexture(canvas);
            const material = new THREE.SpriteMaterial({ map: texture });
            const sprite = new THREE.Sprite(material);
            sprite.position.set(0, 5, 0);
            sprite.scale.set(3, 0.75, 1);
            scene.add(sprite);
        }
        
        createRightHandRuleVisualization();
        
        // 添加网格地面
        const gridHelper = new THREE.GridHelper(10, 10, 0x888888, 0x444444);
        scene.add(gridHelper);
        
        // 动画循环
        let autoRotate = true;
        function animate() {
            requestAnimationFrame(animate);
            
            if (autoRotate) {
                scene.rotation.y += 0.005;
            }
            
            controls.update();
            renderer.render(scene, camera);
        }
        
        animate();
        
        // 响应窗口大小变化
        window.addEventListener('resize', function() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
        
        // 控制按钮
        document.getElementById('rotateToggle').addEventListener('click', function() {
            autoRotate = !autoRotate;
            this.textContent = autoRotate ? '暂停旋转' : '开始旋转';
        });
        
        document.getElementById('resetView').addEventListener('click', function() {
            camera.position.set(5, 5, 5);
            camera.lookAt(0, 0, 0);
            controls.reset();
        });
    </script>
</body>
</html>
