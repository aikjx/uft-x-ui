<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 粒子螺旋 - 手势控制版</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: sans-serif; }
        #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
        #video-container { position: absolute; top: 20px; right: 20px; width: 320px; height: 180px; z-index: 2; border: 2px solid #00ffcc; border-radius: 10px; overflow: hidden; transform: scaleX(-1); /* 镜像翻转 */ }
        video { width: 100%; height: 100%; object-fit: cover; }
        #info-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #00ffcc;
            z-index: 2;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 8px;
            pointer-events: none;
        }
        .param { margin-bottom: 5px; font-size: 14px; }
        .value { font-weight: bold; color: #fff; }
        h3 { margin-top: 0; color: #fff; border-bottom: 1px solid #555; padding-bottom: 5px;}
    </style>
    <!-- 引入 Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- 引入 MediaPipe Hands -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>

    <!-- 信息面板 -->
    <div id="info-panel">
        <h3>粒子螺旋控制台</h3>
        <div class="param">状态: <span id="status" class="value" style="color: yellow;">正在加载模型...</span></div>
        <div class="param">半径 (r): <span id="val-r" class="value">0.00</span> [食指-拇指距离]</div>
        <div class="param">角速度 (ω): <span id="val-omega" class="value">0.00</span> [水平位置]</div>
        <div class="param">上升速度 (h): <span id="val-h" class="value">0.00</span> [垂直位置]</div>
        <div class="param" style="margin-top:10px; font-size:12px; color:#aaa;">请举起一只手对准摄像头</div>
    </div>

    <!-- 摄像头预览 -->
    <div id="video-container">
        <video id="input_video"></video>
    </div>

    <!-- 3D 场景容器 -->
    <div id="canvas-container"></div>

    <script>
        // ==========================================
        // 1. 初始化 Three.js 场景
        // ==========================================
        const scene = new THREE.Scene();
        // 添加一点雾效增加深邃感
        scene.fog = new THREE.FogExp2(0x000000, 0.002);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 50;
        camera.position.y = 20;
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        // ==========================================
        // 2. 创建粒子系统
        // ==========================================
        // 核心数学参数 (初始值)
        let params = {
            r: 10,    // 半径
            omega: 2, // 角速度
            h: 0.5    // 上升速度
        };

        const particleCount = 2000;
        const geometry = new THREE.BufferGeometry();
        const positions = new Float32Array(particleCount * 3);
        const colors = new Float32Array(particleCount * 3);

        // 初始化粒子位置（简单的堆积，后续会在动画循环中重置）
        for (let i = 0; i < particleCount; i++) {
            positions[i * 3] = 0;
            positions[i * 3 + 1] = 0;
            positions[i * 3 + 2] = 0;
            
            // 给粒子一些初始颜色
            const color = new THREE.Color();
            color.setHSL(i / particleCount, 1.0, 0.5);
            colors[i * 3] = color.r;
            colors[i * 3 + 1] = color.g;
            colors[i * 3 + 2] = color.b;
        }

        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

        const material = new THREE.PointsMaterial({
            size: 0.4,
            vertexColors: true,
            transparent: true,
            opacity: 0.8,
            blending: THREE.AdditiveBlending
        });

        const particles = new THREE.Points(geometry, material);
        scene.add(particles);

        // 辅助网格 (地面)
        const gridHelper = new THREE.GridHelper(100, 50, 0x333333, 0x111111);
        scene.add(gridHelper);

        // ==========================================
        // 3. 动画循环与数学公式应用
        // ==========================================
        let time = 0;
        // 使用一个数组来存储历史轨迹，以便绘制长尾巴效果
        // 这里简化处理：每帧更新所有粒子，使它们看起来像是在流动的管道中
        // 这里的 i 代表时间偏移量 t
        
        function animate() {
            requestAnimationFrame(animate);
            time += 0.01;

            const positions = particles.geometry.attributes.position.array;
            const colors = particles.geometry.attributes.color.array;

            // 核心数学公式应用区域
            for (let i = 0; i < particleCount; i++) {
                // 每个粒子代表轨迹上的一个不同时间点
                // tOffset 让粒子铺满整个螺旋线
                const tOffset = i * 0.05; 
                // 动态时间 t，加上偏移量
                const t = time * params.omega + tOffset; 

                // --- 螺旋线公式 ---
                // x(t) = r * cos(ωt)
                // y(t) = h * t  (这里为了视觉效果，让它向上生长)
                // z(t) = r * sin(ωt)
                
                // 我们修改一下，让它像喷泉一样循环，或者限制高度
                // 这里使用模运算让粒子循环流动
                const effectiveT = (tOffset + time * 5) % 100; 
                
                // 实际应用的数学公式：
                const x = params.r * Math.cos(effectiveT * params.omega * 0.1);
                const z = params.r * Math.sin(effectiveT * params.omega * 0.1);
                const y = params.h * effectiveT; // 高度随时间线性增长

                // 更新位置
                positions[i * 3] = x;
                positions[i * 3 + 1] = y;
                positions[i * 3 + 2] = z;

                // 动态更新颜色 (基于高度变化)
                const color = new THREE.Color();
                // 色相随高度变化，产生彩虹效果
                color.setHSL((y / 50) % 1, 1.0, 0.5);
                colors[i * 3] = color.r;
                colors[i * 3 + 1] = color.g;
                colors[i * 3 + 2] = color.b;
            }

            particles.geometry.attributes.position.needsUpdate = true;
            particles.geometry.attributes.color.needsUpdate = true;

            // 缓慢旋转整个场景
            particles.rotation.y += 0.001;

            renderer.render(scene, camera);
        }

        animate();

        // 窗口大小调整
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // ==========================================
        // 4. MediaPipe Hands 手势识别集成
        // ==========================================
        const videoElement = document.getElementById('input_video');
        const statusElement = document.getElementById('status');
        const valR = document.getElementById('val-r');
        const valOmega = document.getElementById('val-omega');
        const valH = document.getElementById('val-h');

        function onResults(results) {
            statusElement.innerText = "运行中 - 检测手部...";
            statusElement.style.color = "#00ffcc";

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const landmarks = results.multiHandLandmarks[0]; // 获取第一只手

                // -----------------------------------------------------
                // 手势映射逻辑
                // -----------------------------------------------------

                // 1. 获取食指尖 (Index Finger Tip - 8) 和 拇指尖 (Thumb Tip - 4)
                const indexTip = landmarks[8];
                const thumbTip = landmarks[4];

                // 计算欧几里得距离来控制半径 r
                const distance = Math.sqrt(
                    Math.pow(indexTip.x - thumbTip.x, 2) +
                    Math.pow(indexTip.y - thumbTip.y, 2)
                );
                
                // 映射距离 (0.02 - 0.3) 到 半径 (5 - 30)
                // 增加平滑系数避免抖动
                const targetR = THREE.MathUtils.mapLinear(distance, 0.05, 0.4, 2, 25);
                params.r += (targetR - params.r) * 0.1; // 简单的平滑插值

                // 2. 获取手掌中心 (Wrist - 0 或 Middle Finger MCP - 9)
                const palmX = landmarks[9].x; // 0.0 (左) - 1.0 (右)
                const palmY = landmarks[9].y; // 0.0 (上) - 1.0 (下)

                // 映射 X 轴位置到 角速度 Omega
                // 手在左边转得慢，在右边转得快 (反转一下x，因为是镜像)
                const targetOmega = THREE.MathUtils.mapLinear(1 - palmX, 0.2, 0.8, 1, 10); 
                params.omega += (targetOmega - params.omega) * 0.1;

                // 映射 Y 轴位置到 上升速度 h
                // 手在上面(y小) h大，手在下面(y大) h小
                const targetH = THREE.MathUtils.mapLinear(1 - palmY, 0.2, 0.8, 0.1, 2.0);
                params.h += (targetH - params.h) * 0.1;

                // 更新 UI
                statusElement.innerText = "已追踪到手势";
                valR.innerText = params.r.toFixed(2);
                valOmega.innerText = params.omega.toFixed(2);
                valH.innerText = params.h.toFixed(2);

            } else {
                statusElement.innerText = "未检测到手部";
                statusElement.style.color = "orange";
            }
        }

        const hands = new Hands({locateFile: (file) => {
            return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
        }});

        hands.setOptions({
            maxNumHands: 1,
            modelComplexity: 1,
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
        });

        hands.onResults(onResults);

        const cameraUtils = new Camera(videoElement, {
            onFrame: async () => {
                await hands.send({image: videoElement});
            },
            width: 320,
            height: 180
        });

        cameraUtils.start();

    </script>
</body>
</html>
