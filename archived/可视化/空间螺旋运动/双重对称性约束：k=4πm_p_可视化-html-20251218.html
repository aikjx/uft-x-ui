<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>双重对称性约束：k=4πm_p 可视化</title>
    <script src=" https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js "></script>
    <script src=" https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.min.js "></script>
    <style>
        body { margin: 0; overflow: hidden; }
        #info { position: absolute; top: 10px; left: 10px; color: white; font-family: Arial; }
    </style>
</head>
<body>
    <div id="info">
        <p>双重对称性约束：空间各向同性（4π）与螺旋运动（4π）导出 k = 4πm_p</p>
        <p>● 球体代表各向同性的立体角 4π</p>
        <p>● 螺旋线代表空间光速圆柱螺旋运动</p>
        <p>● 红色射线代表 n=1 的空间位移矢量，均匀覆盖球面</p>
    </div>
    <script>
        // 初始化场景、相机、渲染器
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // 添加轨道控制
        const controls = new THREE.OrbitControls(camera, renderer.domElement);

        // 添加坐标轴
        const axesHelper = new THREE.AxesHelper(5);
        scene.add(axesHelper);

        // 添加光源
        const light = new THREE.DirectionalLight(0xffffff, 1);
        light.position.set(10, 10, 10);
        scene.add(light);
        scene.add(new THREE.AmbientLight(0x404040));

        // 创建质点（中心物体）
        const sphereGeometry = new THREE.SphereGeometry(0.5, 32, 32);
        const sphereMaterial = new THREE.MeshPhongMaterial({ color: 0xff0000 });
        const sphere = new THREE.Mesh(sphereGeometry, sphereMaterial);
        scene.add(sphere);

        // 创建透明球体（立体角4π）
        const outerSphereGeometry = new THREE.SphereGeometry(5, 32, 32);
        const outerSphereMaterial = new THREE.MeshBasicMaterial({ color: 0x00ff00, transparent: true, opacity: 0.1 });
        const outerSphere = new THREE.Mesh(outerSphereGeometry, outerSphereMaterial);
        scene.add(outerSphere);

        // 绘制从中心出发的射线（代表各向同性）
        const points = [];
        const numPoints = 100;
        for (let i = 0; i < numPoints; i++) {
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(Math.random() * 2 - 1);
            const x = 5 * Math.sin(phi) * Math.cos(theta);
            const y = 5 * Math.sin(phi) * Math.sin(theta);
            const z = 5 * Math.cos(phi);
            points.push(new THREE.Vector3(0, 0, 0), new THREE.Vector3(x, y, z));
        }
        const lineGeometry = new THREE.BufferGeometry().setFromPoints(points);
        const lineMaterial = new THREE.LineBasicMaterial({ color: 0x0000ff, opacity: 0.3 });
        const lines = new THREE.LineSegments(lineGeometry, lineMaterial);
        scene.add(lines);

        // 绘制一条螺旋线（代表螺旋运动）
        const helixPoints = [];
        const R = 2, omega = 1, vZ = 0.5;
        for (let t = 0; t < 4 * Math.PI; t += 0.1) {
            const x = R * Math.cos(omega * t);
            const y = R * Math.sin(omega * t);
            const z = vZ * t;
            helixPoints.push(new THREE.Vector3(x, y, z));
        }
        const helixGeometry = new THREE.BufferGeometry().setFromPoints(helixPoints);
        const helixMaterial = new THREE.LineBasicMaterial({ color: 0xff00ff });
        const helix = new THREE.Line(helixGeometry, helixMaterial);
        scene.add(helix);

        // 绘制一条高亮的空间位移矢量（n=1）
        const arrowHelper = new THREE.ArrowHelper(
            new THREE.Vector3(1, 0, 0).normalize(),
            new THREE.Vector3(0, 0, 0),
            5,
            0xff0000,
            0.5,
            0.2
        );
        scene.add(arrowHelper);

        camera.position.set(10, 10, 10);
        controls.update();

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
