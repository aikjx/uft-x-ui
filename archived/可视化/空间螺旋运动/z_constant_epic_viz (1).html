<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Z ≈ 0.01 - 全自动交互式可视化</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #000;
            color: white;
            overflow: hidden;
            cursor: grab;
        }
        
        body.grabbing { cursor: grabbing; }
        
        #container { position: fixed; width: 100%; height: 100%; }
        
        #main-title {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            z-index: 100;
            pointer-events: none;
        }
        
        #main-title h1 {
            font-size: 65px;
            font-weight: 900;
            background: linear-gradient(90deg, #00ff88, #00ffff, #0088ff, #ff00ff);
            background-size: 300% 100%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradientFlow 3s linear infinite;
            letter-spacing: 8px;
            filter: drop-shadow(0 0 20px rgba(0, 255, 255, 0.6));
        }
        
        #main-title .subtitle {
            font-size: 20px;
            color: #00ffff;
            margin-top: 8px;
            text-shadow: 0 0 15px rgba(0, 255, 255, 0.8);
        }
        
        @keyframes gradientFlow {
            0% { background-position: 0% 50%; }
            100% { background-position: 300% 50%; }
        }
        
        .panel {
            position: fixed;
            background: rgba(0, 5, 15, 0.92);
            backdrop-filter: blur(20px);
            border: 2px solid rgba(0, 255, 255, 0.4);
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 8px 30px rgba(0, 255, 255, 0.3);
            transition: all 0.4s ease;
            z-index: 50;
            max-height: 70vh;
            overflow-y: auto;
        }
        
        .panel.hidden {
            opacity: 0;
            pointer-events: none;
            transform: scale(0.9);
        }
        
        #controls-panel {
            top: 110px;
            left: 20px;
            width: 360px;
        }
        
        #info-panel {
            top: 110px;
            right: 20px;
            width: 340px;
        }
        
        #toolbar {
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: auto;
            display: flex;
            gap: 10px;
            padding: 15px 20px;
        }
        
        .panel h2 {
            color: #00ffff;
            font-size: 22px;
            margin-bottom: 12px;
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.8);
            border-bottom: 2px solid rgba(0, 255, 255, 0.3);
            padding-bottom: 8px;
        }
        
        .slider-group {
            margin: 12px 0;
        }
        
        .slider-group label {
            display: flex;
            justify-content: space-between;
            color: #4fc3f7;
            margin-bottom: 6px;
            font-size: 14px;
            font-weight: 600;
        }
        
        input[type="range"] {
            width: 100%;
            height: 6px;
            background: linear-gradient(90deg, #0088ff, #00ffff);
            border-radius: 10px;
            outline: none;
            -webkit-appearance: none;
            cursor: pointer;
        }
        
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            background: #00ffff;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.8);
        }
        
        .check-group {
            display: flex;
            align-items: center;
            margin: 10px 0;
            padding: 8px;
            background: rgba(0, 100, 200, 0.1);
            border-radius: 6px;
        }
        
        .check-group input[type="checkbox"] {
            width: 18px;
            height: 18px;
            margin-right: 10px;
            cursor: pointer;
            accent-color: #00ffff;
        }
        
        .check-group label {
            color: #4fc3f7;
            font-size: 14px;
            cursor: pointer;
        }
        
        button {
            background: linear-gradient(135deg, #0088ff, #00ffff);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 700;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(0, 136, 255, 0.4);
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 255, 255, 0.6);
        }
        
        .toggle-btn {
            position: absolute;
            top: 12px;
            right: 12px;
            padding: 5px 12px;
            font-size: 11px;
            background: linear-gradient(135deg, #ff00ff, #8800ff);
        }
        
        .view-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin: 10px 0;
        }
        
        .view-buttons button {
            padding: 8px;
            font-size: 12px;
        }
        
        #hint {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.85);
            border: 1px solid rgba(0, 255, 255, 0.3);
            border-radius: 8px;
            padding: 10px 15px;
            font-size: 12px;
            color: #4fc3f7;
            z-index: 100;
        }
        
        #hint div { margin: 3px 0; }
        
        #loading {
            position: fixed;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            transition: opacity 0.5s;
        }
        
        #loading.hidden {
            opacity: 0;
            pointer-events: none;
        }
        
        .spinner {
            width: 60px;
            height: 60px;
            border: 5px solid rgba(0, 255, 255, 0.2);
            border-top: 5px solid #00ffff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        #loading-text {
            margin-top: 20px;
            font-size: 18px;
            color: #00ffff;
        }
        
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: rgba(0, 0, 50, 0.5); }
        ::-webkit-scrollbar-thumb { background: linear-gradient(180deg, #0088ff, #00ffff); border-radius: 10px; }
        
        @media (max-width: 1024px) {
            .panel { width: 90% !important; position: relative !important; margin: 10px auto !important; }
            #main-title h1 { font-size: 40px; }
            #hint { display: none; }
        }
    </style>
</head>
<body>
    <div id="loading">
        <div class="spinner"></div>
        <div id="loading-text">加载中...</div>
    </div>
    
    <div id="container"></div>
    
    <div id="main-title">
        <h1>Z ≈ 0.01</h1>
        <div class="subtitle">圆柱状螺旋运动可视化</div>
    </div>
    
    <div id="controls-panel" class="panel">
        <button class="toggle-btn" onclick="togglePanel('controls-panel')">隐藏</button>
        <h2>⚙️ 控制参数</h2>
        
        <div class="slider-group">
            <label><span>圆柱半径</span><span id="r-val">5.0</span></label>
            <input type="range" id="radius" min="2" max="12" value="5" step="0.1">
        </div>
        
        <div class="slider-group">
            <label><span>螺旋节距</span><span id="p-val">2.0</span></label>
            <input type="range" id="pitch" min="0.5" max="5" value="2" step="0.1">
        </div>
        
        <div class="slider-group">
            <label><span>旋转速度</span><span id="s-val">1.0</span></label>
            <input type="range" id="speed" min="0.1" max="3" value="1" step="0.1">
        </div>
        
        <div class="slider-group">
            <label><span>螺旋数量</span><span id="c-val">8</span></label>
            <input type="range" id="count" min="4" max="16" value="8" step="1">
        </div>
        
        <h2>👁️ 显示选项</h2>
        <div class="check-group">
            <input type="checkbox" id="c1" checked><label for="c1">圆柱骨架</label>
        </div>
        <div class="check-group">
            <input type="checkbox" id="c2" checked><label for="c2">运动粒子</label>
        </div>
        <div class="check-group">
            <input type="checkbox" id="c3" checked><label for="c3">核心</label>
        </div>
        <div class="check-group">
            <input type="checkbox" id="c4" checked><label for="c4">自动旋转</label>
        </div>
        
        <h2>🎥 视角预设</h2>
        <div class="view-buttons">
            <button onclick="setView(0)">正视图</button>
            <button onclick="setView(1)">俯视图</button>
            <button onclick="setView(2)">侧视图</button>
            <button onclick="setView(3)">斜视图</button>
        </div>
    </div>
    
    <div id="info-panel" class="panel">
        <button class="toggle-btn" onclick="togglePanel('info-panel')">隐藏</button>
        <h2>📖 关于 Z ≈ 0.01</h2>
        <p style="line-height:1.6;color:#e0e0e0;font-size:14px;">
            <strong>Z = dn/(dV dt)</strong><br><br>
            空间本身以圆柱状螺旋运动为本质。粒子沿圆柱表面螺旋上升，形成三维运动轨迹。
        </p>
        <h2 style="margin-top:15px;">⚡ 核心方程</h2>
        <p style="line-height:1.6;color:#e0e0e0;font-size:14px;">
            <strong>G = 2Z / c</strong><br><br>
            连接引力常数、光速和Z常数，统一了旋转与平移、引力与离心力。
        </p>
    </div>
    
    <div id="toolbar" class="panel">
        <button onclick="reset()">🔄 重置</button>
        <button onclick="randomize()">🎲 随机</button>
        <button onclick="togglePause()"><span id="pt">⏸️ 暂停</span></button>
        <button onclick="toggleAll()"><span id="at">👁️ 隐藏面板</span></button>
        <button onclick="toggleFullscreen()">🖥️ 全屏</button>
    </div>
    
    <div id="hint">
        <div>🖱️ 拖动：旋转</div>
        <div>🖱️ 滚轮：缩放</div>
        <div>⌨️ 空格：暂停</div>
    </div>
    
    <script>
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setClearColor(0x000000);
        document.getElementById('container').appendChild(renderer.domElement);
        
        camera.position.set(25, 15, 25);
        camera.lookAt(0, 0, 0);
        
        let params = {
            radius: 5,
            pitch: 2,
            speed: 1,
            count: 8,
            cylinder: true,
            particles: true,
            core: true,
            autoRotate: true
        };
        
        let paused = false;
        let time = 0;
        let isDragging = false;
        let lastMouse = { x: 0, y: 0 };
        let cameraAngle = { theta: Math.PI/4, phi: Math.PI/6 };
        let cameraDist = 35;
        
        const helixLines = [];
        const helixParticles = [];
        const rings = [];
        let cylinder, wireframe, core;
        
        // 光源
        scene.add(new THREE.AmbientLight(0x404040, 0.6));
        const light1 = new THREE.PointLight(0x00ffff, 2, 100);
        light1.position.set(0, 0, 0);
        scene.add(light1);
        
        // 星空
        function makeStars() {
            const g = new THREE.BufferGeometry();
            const p = [], c = [];
            for (let i = 0; i < 3000; i++) {
                p.push((Math.random() - 0.5) * 800, (Math.random() - 0.5) * 800, (Math.random() - 0.5) * 800);
                const col = new THREE.Color().setHSL(Math.random() * 0.3 + 0.6, 0.8, 0.6);
                c.push(col.r, col.g, col.b);
            }
            g.setAttribute('position', new THREE.Float32BufferAttribute(p, 3));
            g.setAttribute('color', new THREE.Float32BufferAttribute(c, 3));
            return new THREE.Points(g, new THREE.PointsMaterial({ size: 1.2, vertexColors: true, transparent: true, opacity: 0.8 }));
        }
        const stars = makeStars();
        scene.add(stars);
        
        // 创建圆柱
        function makeCylinder() {
            if (cylinder) scene.remove(cylinder);
            if (wireframe) scene.remove(wireframe);
            rings.forEach(r => scene.remove(r));
            rings.length = 0;
            
            const h = 40;
            const g = new THREE.CylinderGeometry(params.radius, params.radius, h, 64, 20, true);
            cylinder = new THREE.Mesh(g, new THREE.MeshPhongMaterial({
                color: 0x00ff88, transparent: true, opacity: 0.15, side: THREE.DoubleSide,
                emissive: 0x00ff88, emissiveIntensity: 0.3
            }));
            scene.add(cylinder);
            
            wireframe = new THREE.LineSegments(
                new THREE.EdgesGeometry(g),
                new THREE.LineBasicMaterial({ color: 0x00ffff, transparent: true, opacity: 0.7 })
            );
            scene.add(wireframe);
            
            for (let i = -5; i <= 5; i++) {
                const ring = new THREE.Mesh(
                    new THREE.RingGeometry(params.radius - 0.08, params.radius + 0.08, 128),
                    new THREE.MeshBasicMaterial({
                        color: new THREE.Color().setHSL(0.5 + i * 0.05, 1, 0.5),
                        transparent: true, opacity: 0.6, side: THREE.DoubleSide, blending: THREE.AdditiveBlending
                    })
                );
                ring.rotation.x = Math.PI / 2;
                ring.position.y = i * 4;
                ring.userData = { idx: i };
                rings.push(ring);
                scene.add(ring);
            }
        }
        
        // 创建螺旋
        function makeHelix() {
            helixLines.forEach(h => scene.remove(h));
            helixLines.length = 0;
            
            const h = 40;
            const turns = h / params.pitch;
            
            for (let i = 0; i < params.count; i++) {
                const pts = [];
                const angle0 = (i / params.count) * Math.PI * 2;
                
                for (let j = 0; j <= 300; j++) {
                    const t = j / 300;
                    const y = (t - 0.5) * h;
                    const a = angle0 + t * turns * Math.PI * 2;
                    const r = params.radius + Math.sin(t * 10 + i) * 0.2;
                    pts.push(new THREE.Vector3(r * Math.cos(a), y, r * Math.sin(a)));
                }
                
                const line = new THREE.Line(
                    new THREE.BufferGeometry().setFromPoints(pts),
                    new THREE.LineBasicMaterial({
                        color: new THREE.Color().setHSL(i / params.count, 1, 0.6),
                        transparent: true, opacity: 0.95
                    })
                );
                line.userData = { idx: i };
                helixLines.push(line);
                scene.add(line);
            }
        }
        
        // 创建粒子
        function makeParticles() {
            helixParticles.forEach(p => scene.remove(p));
            helixParticles.length = 0;
            
            const h = 40;
            const turns = h / params.pitch;
            
            for (let i = 0; i < params.count; i++) {
                const n = 50;
                const g = new THREE.BufferGeometry();
                const pos = [], col = [], sizes = [];
                const angle0 = (i / params.count) * Math.PI * 2;
                const c = new THREE.Color().setHSL(i / params.count, 1, 0.6);
                
                for (let j = 0; j < n; j++) {
                    const t = j / n;
                    const y = (t - 0.5) * h;
                    const a = angle0 + t * turns * Math.PI * 2;
                    pos.push(params.radius * Math.cos(a), y, params.radius * Math.sin(a));
                    col.push(c.r, c.g, c.b);
                    sizes.push(Math.random() * 0.3 + 0.2);
                }
                
                g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
                g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
                g.setAttribute('size', new THREE.Float32BufferAttribute(sizes, 1));
                
                const pts = new THREE.Points(g, new THREE.PointsMaterial({
                    size: 0.4, vertexColors: true, transparent: true, opacity: 0.95,
                    blending: THREE.AdditiveBlending, sizeAttenuation: true
                }));
                pts.userData = { angle0, idx: i };
                helixParticles.push(pts);
                scene.add(pts);
            }
        }
        
        // 创建核心
        function makeCore() {
            const g = new THREE.Group();
            
            const c = new THREE.Mesh(
                new THREE.IcosahedronGeometry(1.2, 2),
                new THREE.MeshPhongMaterial({
                    color: 0xffaa00, emissive: 0xffaa00, emissiveIntensity: 1.2,
                    transparent: true, opacity: 0.9
                })
            );
            g.add(c);
            
            for (let i = 0; i < 3; i++) {
                const glow = new THREE.Mesh(
                    new THREE.IcosahedronGeometry(1.5 + i * 0.5, 2),
                    new THREE.MeshBasicMaterial({
                        color: new THREE.Color().setHSL(0.15 + i * 0.05, 1, 0.5),
                        transparent: true, opacity: 0.25 - i * 0.05, side: THREE.BackSide,
                        blending: THREE.AdditiveBlending
                    })
                );
                glow.userData = { layer: i };
                g.add(glow);
            }
            
            for (let i = 0; i < 2; i++) {
                const ring = new THREE.Mesh(
                    new THREE.TorusGeometry(2.5 + i * 0.5, 0.1, 16, 100),
                    new THREE.MeshBasicMaterial({
                        color: 0xffaa00, transparent: true, opacity: 0.7,
                        blending: THREE.AdditiveBlending
                    })
                );
                ring.rotation.x = Math.PI / 2 + i * Math.PI / 4;
                ring.userData = { ring: i };
                g.add(ring);
            }
            
            return g;
        }
        
        core = makeCore();
        scene.add(core);
        makeCylinder();
        makeHelix();
        makeParticles();
        
        // 动画
        function animate() {
            requestAnimationFrame(animate);
            
            if (!paused) {
                time += 0.01 * params.speed;
                
                // 更新核心
                if (core) {
                    core.visible = params.core;
                    if (params.core) {
                        core.children[0].rotation.x += 0.015;
                        core.children[0].rotation.y += 0.02;
                        const s = 1 + Math.sin(time * 3.5) * 0.18;
                        core.children[0].scale.set(s, s, s);
                        
                        for (let i = 1; i <= 3; i++) {
                            core.children[i].rotation.x -= 0.008 * i;
                            core.children[i].rotation.y += 0.012 * i;
                        }
                        
                        for (let i = 4; i < core.children.length; i++) {
                            core.children[i].rotation.z += 0.03;
                        }
                    }
                }
                
                // 更新圆柱
                if (cylinder) {
                    cylinder.visible = params.cylinder;
                    wireframe.visible = params.cylinder;
                }
                
                rings.forEach((r, i) => {
                    r.visible = params.cylinder;
                    if (params.cylinder) {
                        const s = 1 + Math.sin(time * 3 + i * 0.3) * 0.08;
                        r.scale.set(s, s, 1);
                        const h = (0.5 + i * 0.05 + time * 0.1) % 1;
                        r.material.color.setHSL(h, 1, 0.5);
                        r.rotation.z += 0.005;
                    }
                });
                
                // 更新螺旋
                helixLines.forEach((h, i) => {
                    const hue = (i / params.count + time * 0.15) % 1;
                    h.material.color.setHSL(hue, 1, 0.6);
                });
                
                // 更新粒子
                helixParticles.forEach(p => {
                    p.visible = params.particles;
                    if (params.particles) {
                        const pos = p.geometry.attributes.position.array;
                        const col = p.geometry.attributes.color.array;
                        const h = 40;
                        const turns = h / params.pitch;
                        const n = pos.length / 3;
                        
                        for (let j = 0; j < n; j++) {
                            const t = ((j / n) + time * 0.08) % 1;
                            const y = (t - 0.5) * h;
                            const a = p.userData.angle0 + t * turns * Math.PI * 2;
                            const r = params.radius + Math.sin(t * 15 + time * 2) * 0.15;
                            
                            pos[j * 3] = r * Math.cos(a);
                            pos[j * 3 + 1] = y;
                            pos[j * 3 + 2] = r * Math.sin(a);
                            
                            const hue = (p.userData.idx / params.count + time * 0.1) % 1;
                            const c = new THREE.Color().setHSL(hue, 1, 0.6);
                            col[j * 3] = c.r;
                            col[j * 3 + 1] = c.g;
                            col[j * 3 + 2] = c.b;
                        }
                        
                        p.geometry.attributes.position.needsUpdate = true;
                        p.geometry.attributes.color.needsUpdate = true;
                    }
                });
                
                stars.rotation.y += 0.0002;
            }
            
            // 相机自动旋转
            if (params.autoRotate && !isDragging) {
                cameraAngle.theta += 0.002;
            }
            
            // 更新相机
            camera.position.x = cameraDist * Math.sin(cameraAngle.phi) * Math.cos(cameraAngle.theta);
            camera.position.y = cameraDist * Math.cos(cameraAngle.phi);
            camera.position.z = cameraDist * Math.sin(cameraAngle.phi) * Math.sin(cameraAngle.theta);
            camera.lookAt(0, 0, 0);
            
            renderer.render(scene, camera);
        }
        
        animate();
        
        // 鼠标控制
        renderer.domElement.addEventListener('mousedown', e => {
            isDragging = true;
            lastMouse = { x: e.clientX, y: e.clientY };
            document.body.classList.add('grabbing');
        });
        
        document.addEventListener('mousemove', e => {
            if (isDragging) {
                const dx = e.clientX - lastMouse.x;
                const dy = e.clientY - lastMouse.y;
                cameraAngle.theta += dx * 0.005;
                cameraAngle.phi = Math.max(0.1, Math.min(Math.PI - 0.1, cameraAngle.phi - dy * 0.005));
                lastMouse = { x: e.clientX, y: e.clientY };
            }
        });
        
        document.addEventListener('mouseup', () => {
            isDragging = false;
            document.body.classList.remove('grabbing');
        });
        
        renderer.domElement.addEventListener('wheel', e => {
            e.preventDefault();
            cameraDist = Math.max(15, Math.min(60, cameraDist + e.deltaY * 0.05));
        });
        
        // 键盘控制
        document.addEventListener('keydown', e => {
            if (e.code === 'Space') {
                e.preventDefault();
                togglePause();
            } else if (e.code === 'KeyR') {
                reset();
            }
        });
        
        // 控制函数
        document.getElementById('radius').oninput = e => {
            params.radius = parseFloat(e.target.value);
            document.getElementById('r-val').textContent = params.radius.toFixed(1);
            makeCylinder(); makeHelix(); makeParticles();
        };
        
        document.getElementById('pitch').oninput = e => {
            params.pitch = parseFloat(e.target.value);
            document.getElementById('p-val').textContent = params.pitch.toFixed(1);
            makeHelix(); makeParticles();
        };
        
        document.getElementById('speed').oninput = e => {
            params.speed = parseFloat(e.target.value);
            document.getElementById('s-val').textContent = params.speed.toFixed(1);
        };
        
        document.getElementById('count').oninput = e => {
            params.count = parseInt(e.target.value);
            document.getElementById('c-val').textContent = params.count;
            makeHelix(); makeParticles();
        };
        
        document.getElementById('c1').onchange = e => { params.cylinder = e.target.checked; };
        document.getElementById('c2').onchange = e => { params.particles = e.target.checked; };
        document.getElementById('c3').onchange = e => { params.core = e.target.checked; };
        document.getElementById('c4').onchange = e => { params.autoRotate = e.target.checked; };
        
        function setView(type) {
            const views = [
                { theta: 0, phi: Math.PI/2 },           // 正视
                { theta: 0, phi: 0.1 },                 // 俯视
                { theta: Math.PI/2, phi: Math.PI/2 },   // 侧视
                { theta: Math.PI/4, phi: Math.PI/6 }    // 斜视
            ];
            cameraAngle = views[type];
        }
        
        function reset() {
            params = {
                radius: 5, pitch: 2, speed: 1, count: 8,
                cylinder: true, particles: true, core: true, autoRotate: true
            };
            
            document.getElementById('radius').value = 5;
            document.getElementById('pitch').value = 2;
            document.getElementById('speed').value = 1;
            document.getElementById('count').value = 8;
            document.getElementById('c1').checked = true;
            document.getElementById('c2').checked = true;
            document.getElementById('c3').checked = true;
            document.getElementById('c4').checked = true;
            
            document.getElementById('r-val').textContent = '5.0';
            document.getElementById('p-val').textContent = '2.0';
            document.getElementById('s-val').textContent = '1.0';
            document.getElementById('c-val').textContent = '8';
            
            cameraAngle = { theta: Math.PI/4, phi: Math.PI/6 };
            cameraDist = 35;
            
            makeCylinder(); makeHelix(); makeParticles();
        }
        
        function randomize() {
            params.radius = 3 + Math.random() * 8;
            params.pitch = 0.8 + Math.random() * 3;
            params.speed = 0.5 + Math.random() * 2;
            params.count = Math.floor(4 + Math.random() * 12);
            
            document.getElementById('radius').value = params.radius;
            document.getElementById('pitch').value = params.pitch;
            document.getElementById('speed').value = params.speed;
            document.getElementById('count').value = params.count;
            
            document.getElementById('r-val').textContent = params.radius.toFixed(1);
            document.getElementById('p-val').textContent = params.pitch.toFixed(1);
            document.getElementById('s-val').textContent = params.speed.toFixed(1);
            document.getElementById('c-val').textContent = params.count;
            
            makeCylinder(); makeHelix(); makeParticles();
        }
        
        function togglePause() {
            paused = !paused;
            document.getElementById('pt').textContent = paused ? '▶️ 继续' : '⏸️ 暂停';
        }
        
        let allHidden = false;
        function toggleAll() {
            allHidden = !allHidden;
            const panels = [document.getElementById('controls-panel'), document.getElementById('info-panel')];
            panels.forEach(p => {
                if (allHidden) p.classList.add('hidden');
                else p.classList.remove('hidden');
            });
            document.getElementById('at').textContent = allHidden ? '👁️ 显示面板' : '👁️ 隐藏面板';
        }
        
        function togglePanel(id) {
            document.getElementById(id).classList.toggle('hidden');
        }
        
        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
            } else {
                document.exitFullscreen();
            }
        }
        
        // 响应式
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
        
        // 加载完成
        setTimeout(() => {
            document.getElementById('loading').classList.add('hidden');
        }, 800);
        
        // 性能优化：降低粒子更新频率
        let frameCount = 0;
        const originalAnimate = animate;
        animate = function() {
            frameCount++;
            if (frameCount % 2 === 0) {
                // 每两帧更新一次粒子
                helixParticles.forEach(p => {
                    if (p.visible && params.particles) {
                        const pos = p.geometry.attributes.position.array;
                        const col = p.geometry.attributes.color.array;
                        const h = 40;
                        const turns = h / params.pitch;
                        const n = pos.length / 3;
                        
                        for (let j = 0; j < n; j++) {
                            const t = ((j / n) + time * 0.08) % 1;
                            const y = (t - 0.5) * h;
                            const a = p.userData.angle0 + t * turns * Math.PI * 2;
                            const r = params.radius + Math.sin(t * 15 + time * 2) * 0.15;
                            
                            pos[j * 3] = r * Math.cos(a);
                            pos[j * 3 + 1] = y;
                            pos[j * 3 + 2] = r * Math.sin(a);
                            
                            const hue = (p.userData.idx / params.count + time * 0.1) % 1;
                            const c = new THREE.Color().setHSL(hue, 1, 0.6);
                            col[j * 3] = c.r;
                            col[j * 3 + 1] = c.g;
                            col[j * 3 + 2] = c.b;
                        }
                        
                        p.geometry.attributes.position.needsUpdate = true;
                        p.geometry.attributes.color.needsUpdate = true;
                    }
                });
            }
            requestAnimationFrame(animate);
            
            if (!paused) {
                time += 0.01 * params.speed;
                
                // 更新核心
                if (core && params.core) {
                    core.visible = true;
                    core.children[0].rotation.x += 0.015;
                    core.children[0].rotation.y += 0.02;
                    const s = 1 + Math.sin(time * 3.5) * 0.18;
                    core.children[0].scale.set(s, s, s);
                    
                    for (let i = 1; i <= 3; i++) {
                        core.children[i].rotation.x -= 0.008 * i;
                        core.children[i].rotation.y += 0.012 * i;
                        const gs = 1 + Math.sin(time * 4 + i * 0.5) * 0.15;
                        core.children[i].scale.set(gs, gs, gs);
                    }
                    
                    for (let i = 4; i < core.children.length; i++) {
                        core.children[i].rotation.z += 0.03 + (i - 4) * 0.01;
                        const rs = 1 + Math.sin(time * 5 + i) * 0.1;
                        core.children[i].scale.set(rs, rs, rs);
                    }
                } else if (core) {
                    core.visible = false;
                }
                
                // 更新圆柱
                if (cylinder && wireframe) {
                    cylinder.visible = params.cylinder;
                    wireframe.visible = params.cylinder;
                }
                
                rings.forEach((r, i) => {
                    r.visible = params.cylinder;
                    if (params.cylinder) {
                        const s = 1 + Math.sin(time * 3 + i * 0.3) * 0.08;
                        r.scale.set(s, s, 1);
                        const h = (0.5 + i * 0.05 + time * 0.1) % 1;
                        r.material.color.setHSL(h, 1, 0.5);
                        r.material.opacity = 0.5 + Math.sin(time * 4 + i * 0.5) * 0.2;
                        r.rotation.z += 0.005;
                    }
                });
                
                // 更新螺旋线
                helixLines.forEach((h, i) => {
                    const hue = (i / params.count + time * 0.15) % 1;
                    h.material.color.setHSL(hue, 1, 0.6);
                    h.material.opacity = 0.85 + Math.sin(time * 2.5 + i * 0.5) * 0.15;
                });
                
                // 更新粒子可见性
                helixParticles.forEach(p => {
                    p.visible = params.particles;
                });
                
                stars.rotation.y += 0.0002;
                stars.rotation.x += 0.0001;
            }
            
            // 相机自动旋转
            if (params.autoRotate && !isDragging && !paused) {
                cameraAngle.theta += 0.002;
            }
            
            // 平滑相机移动
            camera.position.x = cameraDist * Math.sin(cameraAngle.phi) * Math.cos(cameraAngle.theta);
            camera.position.y = cameraDist * Math.cos(cameraAngle.phi);
            camera.position.z = cameraDist * Math.sin(cameraAngle.phi) * Math.sin(cameraAngle.theta);
            camera.lookAt(0, 0, 0);
            
            renderer.render(scene, camera);
        };
        
        animate();
        
        // 触摸支持（移动端）
        let touchStart = null;
        renderer.domElement.addEventListener('touchstart', e => {
            if (e.touches.length === 1) {
                touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
                isDragging = true;
            }
        });
        
        renderer.domElement.addEventListener('touchmove', e => {
            e.preventDefault();
            if (isDragging && touchStart && e.touches.length === 1) {
                const dx = e.touches[0].clientX - touchStart.x;
                const dy = e.touches[0].clientY - touchStart.y;
                cameraAngle.theta += dx * 0.005;
                cameraAngle.phi = Math.max(0.1, Math.min(Math.PI - 0.1, cameraAngle.phi - dy * 0.005));
                touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
            }
        });
        
        renderer.domElement.addEventListener('touchend', () => {
            isDragging = false;
            touchStart = null;
        });
        
        // 双指缩放
        let lastPinchDist = 0;
        renderer.domElement.addEventListener('touchstart', e => {
            if (e.touches.length === 2) {
                const dx = e.touches[0].clientX - e.touches[1].clientX;
                const dy = e.touches[0].clientY - e.touches[1].clientY;
                lastPinchDist = Math.sqrt(dx * dx + dy * dy);
            }
        });
        
        renderer.domElement.addEventListener('touchmove', e => {
            if (e.touches.length === 2) {
                e.preventDefault();
                const dx = e.touches[0].clientX - e.touches[1].clientX;
                const dy = e.touches[0].clientY - e.touches[1].clientY;
                const dist = Math.sqrt(dx * dx + dy * dy);
                const delta = lastPinchDist - dist;
                cameraDist = Math.max(15, Math.min(60, cameraDist + delta * 0.1));
                lastPinchDist = dist;
            }
        });
        
        // 防止页面滚动
        document.body.addEventListener('touchmove', e => {
            if (e.target === renderer.domElement) {
                e.preventDefault();
            }
        }, { passive: false });
        
        console.log('🌀 Z ≈ 0.01 圆柱状螺旋运动可视化');
        console.log('✨ 全自动交互式系统已加载');
        console.log('🎮 使用鼠标拖动旋转，滚轮缩放');
        console.log('⌨️  空格键暂停，R键重置');
    </script>
</body>
</html>
