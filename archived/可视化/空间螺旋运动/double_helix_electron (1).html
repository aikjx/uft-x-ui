<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>电子双层螺旋结构</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: linear-gradient(135deg, #0a0a1a 0%, #1a1a3a 100%);
            font-family: 'Arial', sans-serif;
            color: #fff;
        }
        #container {
            width: 100vw;
            height: 100vh;
        }
        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            padding: 20px;
            border-radius: 10px;
            max-width: 400px;
            backdrop-filter: blur(10px);
            font-size: 13px;
        }
        h1 {
            margin: 0 0 15px 0;
            font-size: 18px;
            color: #00ffff;
        }
        .formula {
            background: rgba(255, 255, 255, 0.1);
            padding: 8px;
            margin: 8px 0;
            border-radius: 5px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
        }
        .highlight {
            color: #00ff88;
            font-weight: bold;
        }
        .controls {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 10px;
            backdrop-filter: blur(10px);
        }
        button {
            background: #00ffff;
            border: none;
            padding: 8px 16px;
            margin: 3px;
            border-radius: 5px;
            cursor: pointer;
            color: #000;
            font-weight: bold;
            font-size: 12px;
            transition: all 0.3s;
        }
        button:hover {
            background: #00ff88;
            transform: scale(1.05);
        }
        .legend {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 10px;
            backdrop-filter: blur(10px);
        }
        .legend-item {
            margin: 6px 0;
            display: flex;
            align-items: center;
            font-size: 13px;
        }
        .color-box {
            width: 18px;
            height: 18px;
            margin-right: 8px;
            border-radius: 3px;
        }
    </style>
</head>
<body>
    <div id="container"></div>
    
    <div id="info">
        <h1>电子双层螺旋环状结构（统一场论）</h1>
        <div class="formula">
            <strong>统一场论电势：</strong><br>
            φ = Q / (<span class="highlight">8π</span>ε₀r)
        </div>
        <div class="formula">
            <strong>统一场论电场：</strong><br>
            E = Q / (<span class="highlight">8π</span>ε₀r²)
        </div>
        <div style="margin-top: 12px; font-size: 12px;">
            <strong>结构特征：</strong><br>
            • 中心点电荷Q（白色发光点）<br>
            • 环状闭合：头尾相接形成完整闭环<br>
            • 双链缠绕：像DNA一样环环相扣<br>
            • 第一层：4π 立体角（红色链）<br>
            • 第二层：4π 立体角（蓝色链）<br>
            • 总立体角：<span class="highlight">8π</span>（双层叠加）<br>
            • 横向耦合：黄色连接桥展示相互作用
        </div>
    </div>

    <div class="legend">
        <h3 style="margin: 0 0 10px 0; font-size: 15px;">图例</h3>
        <div class="legend-item">
            <div class="color-box" style="background: #ff3366;"></div>
            <span>第一层螺旋环（4π）</span>
        </div>
        <div class="legend-item">
            <div class="color-box" style="background: #3366ff;"></div>
            <span>第二层螺旋环（4π）</span>
        </div>
        <div class="legend-item">
            <div class="color-box" style="background: #ffff00;"></div>
            <span>连接桥（横向耦合）</span>
        </div>
        <div class="legend-item">
            <div class="color-box" style="background: #00ffff;"></div>
            <span>电场线（8π立体角）</span>
        </div>
        <div class="legend-item">
            <div class="color-box" style="background: #ffffff;"></div>
            <span>中心点电荷（Q）</span>
        </div>
    </div>

    <div class="controls">
        <button onclick="toggleRotation()">暂停/继续</button>
        <button onclick="toggleBridges()">连接桥</button>
        <button onclick="toggleFieldLines()">电场线</button>
        <button onclick="changeView()">切换视角</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        let scene, camera, renderer;
        let helixGroup, bridges, fieldLines, coreGroup;
        let rotating = true;
        let showBridges = true;
        let showFields = true;
        let viewMode = 0;

        function init() {
            scene = new THREE.Scene();
            scene.fog = new THREE.Fog(0x0a0a1a, 10, 60);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 8, 20);
            camera.lookAt(0, 0, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setClearColor(0x0a0a1a, 1);
            document.getElementById('container').appendChild(renderer.domElement);

            // 光源
            const ambientLight = new THREE.AmbientLight(0x404040, 1.5);
            scene.add(ambientLight);

            const pointLight1 = new THREE.PointLight(0xff3366, 2, 100);
            pointLight1.position.set(15, 10, 10);
            scene.add(pointLight1);

            const pointLight2 = new THREE.PointLight(0x3366ff, 2, 100);
            pointLight2.position.set(-15, -10, -10);
            scene.add(pointLight2);

            const pointLight3 = new THREE.PointLight(0xffff00, 1.5, 100);
            pointLight3.position.set(0, 0, 15);
            scene.add(pointLight3);

            // 创建中心点电荷
            coreGroup = new THREE.Group();
            const corePoint = new THREE.Mesh(
                new THREE.SphereGeometry(0.15, 16, 16),
                new THREE.MeshBasicMaterial({
                    color: 0xffffff,
                    transparent: false
                })
            );
            coreGroup.add(corePoint);
            
            // 添加发光效果
            const glowGeometry = new THREE.SphereGeometry(0.3, 16, 16);
            const glowMaterial = new THREE.MeshBasicMaterial({
                color: 0xffff00,
                transparent: true,
                opacity: 0.6
            });
            const glow = new THREE.Mesh(glowGeometry, glowMaterial);
            coreGroup.add(glow);
            
            // 添加点光源在中心
            const coreLight = new THREE.PointLight(0xffffff, 3, 50);
            coreLight.position.set(0, 0, 0);
            coreGroup.add(coreLight);
            
            scene.add(coreGroup);

            // 创建环状双螺旋
            helixGroup = new THREE.Group();
            createToroidalDoubleHelix();
            scene.add(helixGroup);

            // 创建连接桥
            bridges = new THREE.Group();
            createToroidalBridges();
            helixGroup.add(bridges);

            // 创建电场线
            fieldLines = new THREE.Group();
            createRadialFieldLines();
            scene.add(fieldLines);

            // 环境粒子
            createParticles();

            window.addEventListener('resize', onWindowResize, false);
            animate();
        }

        function createToroidalDoubleHelix() {
            const majorRadius = 8;  // 大环半径
            const minorRadius = 1.5; // 小螺旋半径
            const turns = 8;         // 螺旋圈数
            const segments = 400;

            // 第一条螺旋链（红色）
            const points1 = [];
            for (let i = 0; i <= segments; i++) {
                const t = (i / segments) * Math.PI * 2;
                const pos = getToroidalHelixPoint(majorRadius, minorRadius, turns, t, 0);
                points1.push(pos);
            }

            const curve1 = new THREE.CatmullRomCurve3(points1, true); // true = 闭合曲线
            const tube1 = new THREE.Mesh(
                new THREE.TubeGeometry(curve1, segments, 0.25, 12, true),
                new THREE.MeshPhongMaterial({
                    color: 0xff3366,
                    emissive: 0xff3366,
                    emissiveIntensity: 0.4,
                    shininess: 100
                })
            );
            helixGroup.add(tube1);

            // 第二条螺旋链（蓝色，相位差π）
            const points2 = [];
            for (let i = 0; i <= segments; i++) {
                const t = (i / segments) * Math.PI * 2;
                const pos = getToroidalHelixPoint(majorRadius, minorRadius, turns, t, Math.PI);
                points2.push(pos);
            }

            const curve2 = new THREE.CatmullRomCurve3(points2, true);
            const tube2 = new THREE.Mesh(
                new THREE.TubeGeometry(curve2, segments, 0.25, 12, true),
                new THREE.MeshPhongMaterial({
                    color: 0x3366ff,
                    emissive: 0x3366ff,
                    emissiveIntensity: 0.4,
                    shininess: 100
                })
            );
            helixGroup.add(tube2);

            // 在链上添加节点球
            addHelixNodes(points1, 0xff3366, 60);
            addHelixNodes(points2, 0x3366ff, 60);
        }

        function getToroidalHelixPoint(R, r, turns, t, phaseOffset) {
            // 环形螺旋参数方程
            const theta = t; // 绕大环的角度
            const phi = turns * t + phaseOffset; // 小螺旋的角度
            
            const x = (R + r * Math.cos(phi)) * Math.cos(theta);
            const y = r * Math.sin(phi);
            const z = (R + r * Math.cos(phi)) * Math.sin(theta);
            
            return new THREE.Vector3(x, y, z);
        }

        function addHelixNodes(points, color, count) {
            const step = Math.floor(points.length / count);
            for (let i = 0; i < points.length; i += step) {
                const sphere = new THREE.Mesh(
                    new THREE.SphereGeometry(0.18, 12, 12),
                    new THREE.MeshPhongMaterial({
                        color: color,
                        emissive: color,
                        emissiveIntensity: 0.7
                    })
                );
                sphere.position.copy(points[i]);
                helixGroup.add(sphere);
            }
        }

        function createToroidalBridges() {
            const majorRadius = 8;
            const minorRadius = 1.5;
            const turns = 8;
            const bridgeCount = 50;

            for (let i = 0; i < bridgeCount; i++) {
                const t = (i / bridgeCount) * Math.PI * 2;
                const pos1 = getToroidalHelixPoint(majorRadius, minorRadius, turns, t, 0);
                const pos2 = getToroidalHelixPoint(majorRadius, minorRadius, turns, t, Math.PI);

                // 连接线
                const bridgeGeometry = new THREE.BufferGeometry().setFromPoints([pos1, pos2]);
                const bridge = new THREE.Line(
                    bridgeGeometry,
                    new THREE.LineBasicMaterial({
                        color: 0xffff00,
                        transparent: true,
                        opacity: 0.6,
                        linewidth: 2
                    })
                );
                bridges.add(bridge);

                // 中点球
                const midPoint = new THREE.Vector3().addVectors(pos1, pos2).multiplyScalar(0.5);
                const midSphere = new THREE.Mesh(
                    new THREE.SphereGeometry(0.15, 10, 10),
                    new THREE.MeshPhongMaterial({
                        color: 0xffff00,
                        emissive: 0xffff00,
                        emissiveIntensity: 0.6
                    })
                );
                midSphere.position.copy(midPoint);
                bridges.add(midSphere);
            }
        }

        function createRadialFieldLines() {
            const layers = 6;
            const linesPerLayer = 20;

            for (let layer = 0; layer < layers; layer++) {
                const radius = 10 + layer * 1.5;
                const y = (layer - layers / 2) * 2;

                for (let i = 0; i < linesPerLayer; i++) {
                    const angle = (i / linesPerLayer) * Math.PI * 2;
                    const points = [];

                    for (let r = 10; r < radius + 8; r += 0.8) {
                        const x = Math.cos(angle) * r;
                        const z = Math.sin(angle) * r;
                        points.push(new THREE.Vector3(x, y, z));
                    }

                    const line = new THREE.Line(
                        new THREE.BufferGeometry().setFromPoints(points),
                        new THREE.LineBasicMaterial({
                            color: 0x00ffff,
                            transparent: true,
                            opacity: 0.25
                        })
                    );
                    fieldLines.add(line);
                }
            }
        }

        function createParticles() {
            const particlesGeometry = new THREE.BufferGeometry();
            const particleCount = 2000;
            const positions = new Float32Array(particleCount * 3);

            for (let i = 0; i < particleCount * 3; i++) {
                positions[i] = (Math.random() - 0.5) * 80;
            }

            particlesGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            const particles = new THREE.Points(
                particlesGeometry,
                new THREE.PointsMaterial({
                    color: 0xffffff,
                    size: 0.08,
                    transparent: true,
                    opacity: 0.4
                })
            );
            scene.add(particles);
        }

        function animate() {
            requestAnimationFrame(animate);
            const time = Date.now() * 0.001;

            if (rotating) {
                helixGroup.rotation.y = time * 0.3;
                helixGroup.rotation.x = Math.sin(time * 0.2) * 0.2;
                
                coreGroup.rotation.x = time * 0.8;
                coreGroup.rotation.y = time * 1.2;
                
                // 点电荷发光脉动
                const glowScale = 1 + Math.sin(time * 4) * 0.3;
                if (coreGroup.children[1]) {
                    coreGroup.children[1].scale.set(glowScale, glowScale, glowScale);
                    coreGroup.children[1].material.opacity = 0.4 + Math.sin(time * 4) * 0.3;
                }

                if (bridges) {
                    bridges.children.forEach((child, idx) => {
                        if (child.isMesh) {
                            const scale = 1 + Math.sin(time * 3 + idx * 0.1) * 0.25;
                            child.scale.set(scale, scale, scale);
                        }
                    });
                }

                fieldLines.rotation.y = time * 0.08;
            }

            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function toggleRotation() {
            rotating = !rotating;
        }

        function toggleBridges() {
            showBridges = !showBridges;
            if (bridges) bridges.visible = showBridges;
        }

        function toggleFieldLines() {
            showFields = !showFields;
            if (fieldLines) fieldLines.visible = showFields;
        }

        function changeView() {
            viewMode = (viewMode + 1) % 3;
            if (viewMode === 0) {
                camera.position.set(0, 8, 20);
            } else if (viewMode === 1) {
                camera.position.set(20, 0, 0);
            } else {
                camera.position.set(0, 20, 0);
            }
            camera.lookAt(0, 0, 0);
        }

        let mouseX = 0, mouseY = 0;
        document.addEventListener('mousemove', (e) => {
            mouseX = (e.clientX / window.innerWidth) * 2 - 1;
            mouseY = -(e.clientY / window.innerHeight) * 2 + 1;
            camera.position.x += mouseX * 0.5;
            camera.position.y += mouseY * 0.5;
            camera.lookAt(0, 0, 0);
        });

        init();
    </script>
</body>
</html>
